  syncTimer = setTimeout(()=>syncNow(false), 2000);
}

function todaysWorkoutId(){
  if(S.override && S.override.date === todayStr()) return S.override.workoutId;
  return ROTATION[S.pointer];
}
function altIndex(wid){
  return S.sessions.filter(s=>s.workoutId===wid).length % 2;
}
// (UNILATERAL + isSingleArm live near the top of the file — migrate() needs them.)
// Which arm to START with this session. Flips every session of that day:
// session 0,2,4 → Right first; 1,3,5 → Left first.
function startSideFor(wid){ return altIndex(wid) === 0 ? "R" : "L"; }
function sideWord(side){ return side === "L" ? "LEFT" : "RIGHT"; }
function activeVariant(wid, e){
  if(!e.alt) return e;
  return altIndex(wid)===0 ? e : e.alt;
}
function widName(wid){ return wid==="finisher" ? "Finisher" : META[wid].name; }
function resolvedProgram(wid){
  const main = S.program[wid].map(e=>{
    const v = activeVariant(wid, e);
    return {chosen:v, other: e.alt ? (v===e ? e.alt : e) : null, isFinisher:false};
  });
  const fin = (S.program.finisher||[]).map(e=>({chosen:e, other:null, isFinisher:true}));
  return main.concat(fin);
}
/* ---------- "last time" lookup ----------
   Two things used to go wrong here:

   1. The finisher runs at the END OF EVERY WORKOUT, but the lookup preferred a
      session with the SAME rotation day. So on a chest day, the ab crunch showed the
      weight from the last *chest* day — not from yesterday's back day, which is
      actually the last time you did that movement. Anything flagged as a finisher now
      searches every session in date order (anyDay), so "last" means literally last.

   2. The finisher has THREE entries and two of them are the same movement
      (crunch → leg raise → crunch). `entries.find(byName)` always returned the FIRST
      crunch, so the closing crunch showed the opening crunch's numbers. Lookups are
      now occurrence-aware: the 2nd crunch matches the 2nd crunch.                  */
function nrm(n){ return String(n==null?"":n).trim().toLowerCase().replace(/\s+/g," "); }
function occurrencesIn(session, exName){
  const k = nrm(exName);
  return (session.entries||[]).filter(en=>nrm(en.name)===k);
}
// How many entries BEFORE index i share this entry's name → its occurrence number.
function occIndex(list, i){
  const k = nrm(list[i] && (list[i].name || (list[i].chosen && list[i].chosen.name)));
  let n = 0;
  for(let j=0;j<i;j++){
    const nm = nrm(list[j] && (list[j].name || (list[j].chosen && list[j].chosen.name)));
    if(nm===k) n++;
  }
  return n;
}
function lastEntryFor(workoutId, exName, anyDay, occ){
  occ = occ || 0;
  const passes = anyDay ? [1] : [0,1];
  for(const pass of passes){
    for(let i=S.sessions.length-1;i>=0;i--){
      const s = S.sessions[i];
      if(pass===0 && s.workoutId!==workoutId) continue;
      const hits = occurrencesIn(s, exName);
      if(!hits.length) continue;
      const e = hits[Math.min(occ, hits.length-1)];
      return {sets:e.sets, date:s.date, workoutId:s.workoutId, sameDay:s.workoutId===workoutId};
    }
  }
  return null;
}
function lastSetsFor(workoutId, exName, anyDay, occ){
  const l = lastEntryFor(workoutId, exName, anyDay, occ);
  return l ? l.sets : null;
}
function lastBox(workoutId, exName, anyDay, occ){
  const l = lastEntryFor(workoutId, exName, anyDay, occ);
  if(!l) return null;
  const sets = l.sets.filter(st=>st.reps||st.weight);
  if(!sets.length) return null;
  const d = new Date(l.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const color = META[workoutId] ? META[workoutId].color : "var(--dim)";
  // for the every-workout finisher, say which day it was so it's never ambiguous
  const tag = (anyDay && l.workoutId && META[l.workoutId] && l.workoutId!==workoutId)
    ? "Last<br>"+esc(d)+" <span style='opacity:.7'>("+esc(META[l.workoutId].short)+")</span>"
    : "Last<br>"+esc(d);
  return `<div class="ex-last" style="border-left-color:${color}">
    <span class="ll-tag">${tag}</span>
    ${sets.map(st=>`<span class="ll-set">${esc(fmtSetShort(st))}</span>`).join("")}
  </div>`;
}
function exHistory(name, n, occ){
  occ = occ || 0;
  const out = [];
  for(let i=S.sessions.length-1; i>=0 && out.length<n; i--){
    const hits = occurrencesIn(S.sessions[i], name);
    if(!hits.length) continue;
    const e = hits[Math.min(occ, hits.length-1)];
    const sets = e.sets.filter(st=>st.reps||st.weight);
    if(sets.length) out.push({date:S.sessions[i].date, sets});
  }
  return out; // newest first
}
function insight(exName, occ){
  const h = exHistory(exName, 3, occ);
  if(h.length < 2) return null;
  const top = sess => sess.sets.reduce((b,st)=>{
    const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
    return (!b || w>b.w || (w===b.w && r>b.r)) ? {w,r} : b;
  }, null);
  const avgRpe = sess => {
    const a = sess.sets.map(st=>parseFloat(st.rpe)).filter(x=>!isNaN(x));
    return a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
  };
  const t0 = top(h[0]), t1 = top(h[1]);
  const isBw = t0.w === 0; // no load logged = bodyweight movement
  if(t0.w > t1.w){
    return {tag:"Trend", msg: t1.w===0
      ? "Added load to a bodyweight movement — see how it holds"
      : "Moved up from "+t1.w+" lb last session — see how it holds"};
  }
  if(t0.w === t1.w){
    const tOld = top(h[h.length-1]);
    const at = isBw ? "" : "at "+t0.w+" lb ";
    if(tOld.w===t0.w && t0.r - tOld.r >= 2){
      return {tag:"Trend", msg:"Reps climbing "+at+"("+tOld.r+" → "+t0.r+")"+(isBw
        ? " — bodyweight is getting comfortable"
        : " — may be ready for more weight")};
    }
    if(t1.r - t0.r >= 2){
      return {tag:"Watch", msg:"Reps dipped "+at+"("+t1.r+" → "+t0.r+") — could be fatigue"};
    }
  }
  const r0 = avgRpe(h[0]), r1 = avgRpe(h[1]);
  if(!isNaN(r0) && !isNaN(r1) && r0>=9.3 && r1>=9.3){
    return {tag:"Watch", msg:"Consistently near failure here two sessions running"};
  }
  return null;
}
function fmtSet(st){
  if(!st) return "—";
  let out = (st.weight!=null && st.weight!=="" ? st.weight : "bw") + "×" + (st.reps||"?");
  if(st.rpe) out += " · RPE "+st.rpe;
  return out;
}

/* =====================================================================
   MUSCLE MODEL — the data behind the Body tab

   Volume landmarks follow the widely used MEV / MAV / MRV framework
   (Israetel et al.): MEV is roughly the least weekly volume that still grows a
   muscle, MAV the productive middle, MRV the most it can recover from. Numbers are
   HARD SETS PER MUSCLE PER WEEK, which is the unit the research is expressed in.
   `recov` is the hours a normal hard session for that muscle needs before it's back —
   small muscles turn around fast, spinal erectors and quads are the slowest.
   ===================================================================== */
const MUSCLES = {
  chest:       {name:"Chest",        lc:"chest",       pl:0, mev:10, mav:20, mrv:24, recov:48},
  delts_front: {name:"Front Delts",  lc:"front delt",  pl:1, mev:6,  mav:14, mrv:20, recov:40},
  delts_side:  {name:"Side Delts",   lc:"side delt",   pl:1, mev:8,  mav:20, mrv:26, recov:36},
  delts_rear:  {name:"Rear Delts",   lc:"rear delt",   pl:1, mev:6,  mav:18, mrv:24, recov:36},
  triceps:     {name:"Triceps",      lc:"tricep",      pl:1, mev:6,  mav:16, mrv:22, recov:40},
  biceps:      {name:"Biceps",       lc:"bicep",       pl:1, mev:8,  mav:18, mrv:24, recov:40},
  forearms:    {name:"Forearms",     lc:"forearm",     pl:1, mev:4,  mav:12, mrv:18, recov:32},
  lats:        {name:"Lats",         lc:"lat",         pl:1, mev:10, mav:20, mrv:24, recov:48},
  traps:       {name:"Upper Back",   lc:"upper back",  pl:0, mev:6,  mav:18, mrv:24, recov:48},
  lower_back:  {name:"Lower Back",   lc:"lower back",  pl:0, mev:4,  mav:10, mrv:14, recov:60},
  abs:         {name:"Abs",          lc:"ab",          pl:1, mev:6,  mav:16, mrv:22, recov:36},
  obliques:    {name:"Obliques",     lc:"oblique",     pl:1, mev:4,  mav:12, mrv:16, recov:36},
  glutes:      {name:"Glutes",       lc:"glute",       pl:1, mev:4,  mav:12, mrv:18, recov:48},
  quads:       {name:"Quads",        lc:"quad",        pl:1, mev:8,  mav:18, mrv:22, recov:60},
  hams:        {name:"Hamstrings",   lc:"hamstring",   pl:1, mev:6,  mav:16, mrv:20, recov:60},
  calves:      {name:"Calves",       lc:"calf",        pl:1, mev:8,  mav:16, mrv:22, recov:36}
};
const MKEYS = Object.keys(MUSCLES);
// "Lats ARE under-stimulated" / "Chest IS under-stimulated"
function mIs(m){ return MUSCLES[m].pl ? "are" : "is"; }
function mIts(m){ return MUSCLES[m].pl ? "their" : "its"; }
function mMovement(m){ return MUSCLES[m].lc + " movement"; }

/* Which muscles a set actually pays into. 1 = the target, fractions = meaningful
   secondary work. Counting secondaries at a fraction is why a chest day still shows
   up on your triceps and front delts — because it does. */
const EX_MUSCLES = {
  // chest
  "dumbbell bench press":          {chest:1, delts_front:.5, triceps:.5},
  "incline dumbbell bench press":  {chest:1, delts_front:.6, triceps:.4},
  "mid cable fly (on bench)":      {chest:1, delts_front:.3},
  "cable chest press (on bench)":  {chest:1, delts_front:.4, triceps:.4},
  "guillotine press":              {chest:1, delts_front:.4, triceps:.4},
  "chest dips":                    {chest:1, triceps:.6, delts_front:.4},
  // back
  "lat pulldown":                  {lats:1, biceps:.5, traps:.3, forearms:.3},
  "mid row":                       {traps:1, lats:.8, biceps:.5, delts_rear:.4, forearms:.3},
  "dumbbell rdl":                  {hams:1, glutes:.8, lower_back:.6, traps:.3, forearms:.4},
  "cable lat prayer":              {lats:1, abs:.3},
  // arms
  "incline dumbbell curl":         {biceps:1, forearms:.4},
  "tricep pushdown":               {triceps:1},
  "preacher curl":                 {biceps:1, forearms:.3},
  "tricep kickback":               {triceps:1, delts_rear:.2},
  "spider curl":                   {biceps:1, forearms:.3},
  "hammer curl":                   {biceps:1, forearms:.6},
  "cable tricep extension":        {triceps:1},
  // shoulders
  "smith machine shoulder press":  {delts_front:1, delts_side:.6, triceps:.5, traps:.3},
  "alternating cable lateral raise":{delts_side:1, traps:.3},
  "cable reverse rear delt fly":   {delts_rear:1, traps:.5},
  // legs
  "leg curl":                      {hams:1, calves:.2},
  "leg extension":                 {quads:1},
  "hip thrust":                    {glutes:1, hams:.5},
  "smith machine squat":           {quads:1, glutes:.8, hams:.4, lower_back:.3},
  "standing calf raise (smith)":   {calves:1},
  // finisher
  "cable ab crunch":               {abs:1, obliques:.3},
  "leg raises":                    {abs:1, obliques:.4}
};
// Anything you add later still lands somewhere sensible via its name.
const MUSCLE_KEYWORDS = [
  [/bench|pec |pec$|\bfly\b|flye|chest press|\bdip|push[- ]?up|guillotine/, {chest:1, delts_front:.4, triceps:.4}],
  [/pulldown|pull[- ]?up|chin[- ]?up|pullover|lat prayer|straight[- ]?arm/,  {lats:1, biceps:.4, traps:.3}],
  [/\brow\b|row$|shrug|face pull|rear delt|reverse fly/,                    {traps:1, lats:.6, delts_rear:.6, biceps:.4}],
  [/lateral raise|side raise|upright row/,                                  {delts_side:1, traps:.3}],
  [/(shoulder|overhead|military|arnold).*(press)|press.*(overhead)/,        {delts_front:1, delts_side:.5, triceps:.5}],
  [/curl/,                                                                 {biceps:1, forearms:.4}],
  [/tricep|skull|pushdown|kickback|overhead extension|close[- ]?grip/,      {triceps:1}],
  [/wrist|grip|farmer/,                                                    {forearms:1}],
  [/squat|leg press|lunge|split squat|hack/,                               {quads:1, glutes:.7, hams:.3}],
  [/leg extension|sissy/,                                                  {quads:1}],
  [/(leg|lying|seated|nordic).*(curl)|rdl|romanian|good ?morning|stiff[- ]?leg/, {hams:1, glutes:.6, lower_back:.4}],
  [/hip thrust|glute bridge|kickback.*glute|abduction/,                    {glutes:1, hams:.4}],
  [/calf|calve|soleus/,                                                    {calves:1}],
  [/deadlift|back extension|hyperextension|erector/,                       {lower_back:1, glutes:.7, hams:.7, traps:.4}],
  [/crunch|sit[- ]?up|leg raise|ab wheel|hollow|plank|\babs?\b/,           {abs:1, obliques:.3}],
  [/oblique|russian twist|side bend|woodchop/,                             {obliques:1, abs:.4}]
];
function musclesFor(name){
  const k = nrm(name);
  if(EX_MUSCLES[k]) return EX_MUSCLES[k];
  for(const [re, m] of MUSCLE_KEYWORDS){ if(re.test(k)) return m; }
  return null;
}
// No RPE logged? Assume a normal hard working set rather than throwing the set away.
function effRpe(st){ const r = parseFloat(st && st.rpe); return r > 0 ? r : 8; }
function isWorkingSet(st){ return (parseFloat(st && st.reps)||0) > 0; }

const DAY_MS = 86400000;
function blankMuscleMap(v){ const o = {}; MKEYS.forEach(k=> o[k] = (typeof v==="function" ? v(k) : v)); return o; }

/* Walk every logged set in a time window and attribute it to muscles. */
function windowStats(from, to){
  const out = blankMuscleMap(()=>({sets:0, vol:0, best:0, lastMs:0, lastSets:0, hardSets:0,
                                   nearFail:0, restN:0, restShort:0, exs:{}}));
  S.sessions.forEach(s=>{
    if(s.startedAt < from || s.startedAt >= to) return;
    s.entries.forEach(e=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      e.sets.forEach(st=>{
        if(!isWorkingSet(st)) return;
        const reps = parseFloat(st.reps)||0;
        const w = parseFloat(st.weight)||0;
        const rpe = effRpe(st);
        const e1 = w > 0 ? est1RM(w, reps) : reps;   // bodyweight → reps stand in for load
        const tgt = restTargetFor(e, st);
        Object.keys(mm).forEach(m=>{
          const o = out[m];
          if(!o) return;
          const c = mm[m];
          o.sets += c;
          o.vol  += w * reps * c;
          o.exs[e.name] = (o.exs[e.name]||0) + c;
          if(rpe >= 7) o.hardSets += c;
          if(rpe >= 9.5) o.nearFail += c;
          if(mm[m] >= 1 && e1 > o.best) o.best = e1;
          if(st.rest != null){ o.restN += 1; if(st.rest < tgt.warn) o.restShort += 1; }
          if(s.startedAt > o.lastMs){ o.lastMs = s.startedAt; o.lastSets = 0; }
          if(s.startedAt === o.lastMs) o.lastSets += c;
        });
      });
    });
  });
  return out;
}

/* Fatigue — every hard set leaves a residue that decays exponentially with the
   muscle's own recovery half-life, scaled by how close to failure it was. 100 means
   "you've just dumped a full MRV week onto this muscle". */
function fatigueByMuscle(now){
  const raw = blankMuscleMap(0);
  S.sessions.forEach(s=>{
    const hrs = (now - s.startedAt)/3600e3;
    if(hrs < 0 || hrs > 14*24) return;
    s.entries.forEach(e=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      e.sets.forEach(st=>{
        if(!isWorkingSet(st)) return;
        const rpe = effRpe(st);
        // RPE 6 → 0.55×, RPE 10 → 1.30× — proximity to failure drives fatigue cost
        const intensity = 0.55 + Math.max(0, Math.min(1, (rpe - 6)/4)) * 0.75;
        Object.keys(mm).forEach(m=>{
          if(raw[m] === undefined) return;
          raw[m] += mm[m] * intensity * Math.pow(0.5, hrs / MUSCLES[m].recov);
        });
      });
    });
  });
  return blankMuscleMap(m => Math.max(0, Math.min(100, Math.round(raw[m] / MUSCLES[m].mrv * 100))));
}

/* Sleep and energy don't change per-muscle, but they absolutely change how fast any
   of it comes back — so they shift every muscle's recovery clock together. */
function recoveryModifier(){
  const days = [];
  for(let i=0;i<3;i++){
    const d = new Date(Date.now() - i*DAY_MS).toLocaleDateString("en-CA");
    const ci = (S.checkins||{})[d];
    if(ci) days.push(ci);
  }
  if(!days.length) return {mod:0, why:[]};
  let mod = 0; const why = [];
  const sl = days.map(c=>parseFloat(c.sleep)).filter(x=>x>0);
  if(sl.length){
    const avg = sl.reduce((a,b)=>a+b,0)/sl.length;
    if(avg < 6){ mod -= 18; why.push("averaging "+avg.toFixed(1)+" h sleep — under 6 h measurably blunts recovery"); }
    else if(avg < 7){ mod -= 8; why.push("averaging "+avg.toFixed(1)+" h sleep — a little short of the 7–9 h window"); }
    else if(avg >= 8){ mod += 6; why.push("averaging "+avg.toFixed(1)+" h sleep — recovery is well supported"); }
  }
  const en = days.map(c=>parseFloat(c.energy)).filter(x=>x>0);
  if(en.length){
    const avg = en.reduce((a,b)=>a+b,0)/en.length;
    if(avg <= 4){ mod -= 10; why.push("self-rated energy is low ("+avg.toFixed(1)+"/10)"); }
    else if(avg >= 8){ mod += 4; why.push("self-rated energy is high ("+avg.toFixed(1)+"/10)"); }
  }
  return {mod: Math.max(-25, Math.min(10, mod)), why};
}

/* Recovery — how far through its own recovery window each muscle is. Distinct from
   fatigue: a muscle hammered 6 days ago is fully recovered even if the week's fatigue
   residue is still on the books. Heavier days stretch the window proportionally. */
function recoveryByMuscle(now, wk, modInfo){
  const mod = modInfo.mod;
  return blankMuscleMap(m=>{
    const o = wk[m];
    if(!o || !o.lastMs) return 100;                  // nothing to recover from
    const hrs = (now - o.lastMs)/3600e3;
    const typical = Math.max(2, MUSCLES[m].mav/3);    // a "normal" session's set count
    const load = Math.min(2, Math.max(0.55, (o.lastSets || 1) / typical));
    const need = MUSCLES[m].recov * load;
    return Math.max(0, Math.min(100, Math.round(hrs/need*100 + mod)));
  });
}

/* Growth — is the muscle actually progressing? Compares the last 3 weeks against the
   3 before it on estimated 1RM (the strength signal, weighted 70%) and total volume
   (the stimulus signal, 30%). 50 = holding steady, 100 = ~+12% and climbing fast. */
function growthByMuscle(now){
  const W = 21*DAY_MS;
  const a = windowStats(now - W, now + 1);
  const b = windowStats(now - 2*W, now - W);
  const out = {};
  MKEYS.forEach(m=>{
    if(!a[m].sets){ out[m] = {score:null, note:"not trained in the last 3 weeks"}; return; }
    if(!b[m].sets){ out[m] = {score:55, note:"first block on record — nothing to compare against yet", isNew:true}; return; }
    const strP = b[m].best > 0 ? (a[m].best - b[m].best)/b[m].best : 0;
    const volP = b[m].vol  > 0 ? (a[m].vol  - b[m].vol )/b[m].vol  : 0;
    const raw = strP*0.7 + volP*0.3;
    out[m] = {score: Math.max(0, Math.min(100, Math.round(50 + raw*400))), strP, volP,
              bestNow:a[m].best, bestPrev:b[m].best};
  });
  return out;
}

/* Injury risk — five independent flags, each grounded in something measurable:
     • weekly volume past MRV (the muscle can't recover from what's going in)
     • an acute:chronic workload ratio above ~1.5, the classic spike marker from
       sports-science injury literature
     • high standing fatigue combined with low recovery
     • a large share of sets taken to true failure (RPE 9.5+)
     • heavy sets cut short on rest, so load is being handled pre-recovered            */
function injuryByMuscle(now, wk, fat, rec){
  const chronic = windowStats(now - 28*DAY_MS, now + 1);
  const out = {};
  MKEYS.forEach(m=>{
    const M = MUSCLES[m];
    const sets = wk[m].sets;
    const flags = [];
    let risk = 0;

    if(sets > M.mrv){
      const over = Math.min(1, (sets - M.mrv)/M.mrv);
      risk += 28*over + 8;
      flags.push({w:Math.round(28*over+8), t:"weekly volume is past what this muscle recovers from ("+r1(sets)+" vs MRV "+M.mrv+")"});
    }
    const chronicWk = chronic[m].sets/4;
    if(chronicWk >= 2){
      const acwr = sets/chronicWk;
      if(acwr > 1.5){
        const x = Math.min(1, (acwr - 1.5)/1.0);
        risk += 24*x + 6;
        flags.push({w:Math.round(24*x+6), t:"this week is "+acwr.toFixed(1)+"× your 4-week average — spikes above 1.5× are the classic injury marker"});
      }
    }
    if(fat[m] >= 55 && rec[m] <= 55){
      const x = Math.min(1, (fat[m]-55)/45) * Math.min(1, (55-rec[m])/55 + .35);
      risk += 22*x;
      if(22*x >= 4) flags.push({w:Math.round(22*x), t:"carrying "+fat[m]+"% fatigue with only "+rec[m]+"% recovery banked"});
    }
    if(wk[m].hardSets > 0){
      const share = wk[m].nearFail/wk[m].hardSets;
      if(share > 0.4){
        const x = Math.min(1, (share-0.4)/0.6);
        risk += 14*x;
        if(14*x >= 3) flags.push({w:Math.round(14*x), t:Math.round(share*100)+"% of sets taken to true failure (RPE 9.5+) — connective tissue pays for that"});
      }
    }
    if(wk[m].restN >= 3){
      const share = wk[m].restShort/wk[m].restN;
      if(share > 0.3){
        const x = Math.min(1, (share-0.3)/0.7);
        risk += 12*x;
        if(12*x >= 3) flags.push({w:Math.round(12*x), t:Math.round(share*100)+"% of sets started before the rest that load called for"});
      }
    }
    out[m] = {score: Math.max(0, Math.min(100, Math.round(risk))), flags:flags.sort((a,b)=>b.w-a.w)};
  });
  return out;
}
function r1(n){ return Math.round(n*10)/10; }

function volState(m, sets){
  const M = MUSCLES[m];
  if(sets <= 0)      return {k:"none",    label:"untrained", txt:"no sets logged this week"};
  if(sets < M.mev)   return {k:"under",   label:"under MEV", txt:r1(sets)+" of the ~"+M.mev+" weekly sets it takes to grow"};
  if(sets <= M.mav)  return {k:"optimal", label:"in range",  txt:r1(sets)+" sets — inside the productive "+M.mev+"–"+M.mav+" window"};
  if(sets <= M.mrv)  return {k:"high",    label:"high",      txt:r1(sets)+" sets — above MAV "+M.mav+", still recoverable"};
  return               {k:"over",    label:"over MRV",  txt:r1(sets)+" sets — past MRV "+M.mrv+", more than it can recover from"};
}

/* One call, everything the Body tab needs. */
function bodyAnalysis(){
  const now = Date.now();
  const wk     = windowStats(now - 7*DAY_MS,  now + 1);
  const prevWk = windowStats(now - 14*DAY_MS, now - 7*DAY_MS);
  const fat    = fatigueByMuscle(now);
  const modInfo= recoveryModifier();
  const rec    = recoveryByMuscle(now, wk, modInfo);
  const grow   = growthByMuscle(now);
  const inj    = injuryByMuscle(now, wk, fat, rec);
  const vol    = blankMuscleMap(m => wk[m].sets);
  const state  = blankMuscleMap(m => volState(m, wk[m].sets));

  /* Whole-body load. Deliberately NOT the sum of the per-muscle numbers: a bench press
     set pays into chest, front delts and triceps, so summing those columns would report
     three times the sets you actually did. This counts real working sets performed. */
  const rawSets = (from, to)=>{
    let n = 0;
    S.sessions.forEach(s=>{
      if(s.startedAt < from || s.startedAt >= to) return;
      s.entries.forEach(e=> e.sets.forEach(st=>{ if(isWorkingSet(st)) n++; }));
    });
    return n;
  };
  const totals = {
    setsWk: rawSets(now - 7*DAY_MS, now + 1),
    setsPrev: rawSets(now - 14*DAY_MS, now - 7*DAY_MS),
    fat: Math.round(MKEYS.reduce((t,m)=>t+fat[m],0)/MKEYS.length),
    rec: Math.round(MKEYS.reduce((t,m)=>t+rec[m],0)/MKEYS.length),
    inj: Math.round(Math.max(...MKEYS.map(m=>inj[m].score)))
  };
  const chronicWkAll = rawSets(now - 28*DAY_MS, now + 1)/4;
  totals.acwr = chronicWkAll >= 4 ? (totals.setsWk/chronicWkAll) : null;

  return {now, wk, prevWk, fat, rec, grow, inj, vol, state, totals, modInfo,
          weak: weakPoints({wk, prevWk, fat, rec, grow, inj, state})};
}

/* =============== WEAK POINT DETECTION ===============
   Five separate lenses, because "weak point" means different things: a muscle can be
   under-stimulated, stalled, structurally out of balance with its opposite, neglected
   outright, or being driven past what it recovers from.                            */
function weakPoints(A){
  const out = [];
  // `score` is 0–100 confidence-weighted urgency; the displayed severity band is
  // derived from it, so a 5%-short muscle never shouts as loud as a missing one.
  const push = (score, muscle, title, why, fix)=> out.push({
    score, sev: score>=68 ? 3 : score>=38 ? 2 : 1, muscle, title, why, fix
  });

  // 1 — under-stimulated relative to minimum effective volume
  MKEYS.forEach(m=>{
    const M = MUSCLES[m], s = A.wk[m].sets, p = A.prevWk[m].sets;
    if(s <= 0 && p <= 0) return;                     // rule 2 owns the "not trained at all" case
    if(s >= M.mev) return;
    const shortfall = (M.mev - s)/M.mev;             // 0 → at MEV, 1 → nothing at all
    const chronic = p < M.mev;
    const score = Math.min(100, Math.round(shortfall*80*(chronic?1.25:0.8)));
    if(score < 18) return;                           // a rounding-error shortfall isn't a weak point
    push(score, m, M.name+" "+mIs(m)+" under-stimulated",
      r1(s)+" hard sets in the last 7 days against a minimum effective volume of about "+M.mev+
      (chronic ? ". It was short the week before too, so this isn't a one-off light week." : ", though last week was in range."),
      "Add about "+Math.max(2, Math.ceil(M.mev - s))+" hard sets a week — one more "+mMovement(m)+
      " of 3 sets, or a set onto each "+mMovement(m)+" you already run.");
  });

  // 2 — nothing in the program trains it
  MKEYS.forEach(m=>{
    if(A.wk[m].sets > 0 || A.prevWk[m].sets > 0) return;
    if(A.grow[m].score !== null) return;             // trained inside 3 weeks, just not lately
    push(92, m, "Nothing in your program trains "+MUSCLES[m].name.toLowerCase(),
      "No logged sets in the last 3 weeks. With no direct work, "+MUSCLES[m].lc+"s can only fall behind everything around them.",
      "Add one direct movement. Even "+MUSCLES[m].mev+" sets a week is the difference between holding ground and losing it.");
  });

  // 3 — stalled despite adequate volume
  MKEYS.forEach(m=>{
    const g = A.grow[m];
    if(!g || g.score === null || g.isNew) return;
    if(A.wk[m].sets < MUSCLES[m].mev) return;        // rule 1 already owns this case
    if(g.score >= 45) return;
    const dropped = g.strP < -0.02;
    const score = dropped ? Math.min(95, 55 + Math.abs(g.strP)*300) : 42;
    push(Math.round(score), m, MUSCLES[m].name+" "+(MUSCLES[m].pl?"have":"has")+" stalled",
      "Volume is adequate but estimated strength is "+(dropped ? "down "+Math.abs(Math.round(g.strP*100))+"%" : "flat")+
      " versus the previous 3 weeks"+(g.bestPrev ? " ("+Math.round(g.bestPrev)+" → "+Math.round(g.bestNow)+" lb estimated 1RM)" : "")+
      ". More sets is the wrong lever when the sets you already do aren't converting.",
      dropped
        ? "Take a lighter week — about half the sets at the same loads — then rebuild. A stall with falling strength is usually accumulated fatigue, not too little work."
        : "Change the stimulus rather than the amount: swap the main movement, slow the eccentric to 3 seconds, or take the top set one RPE closer to failure.");
  });

  // 4 — structural balance between opposing / paired muscles
  const ratios = [
    {a:["chest","delts_front","triceps"], b:["lats","traps","biceps"],
     an:"pushing", bn:"pulling", lo:0.75, hi:1.35,
     fixLow:"Add pressing volume — your back work is outpacing your chest and front delts.",
     fixHigh:"Add rowing and pulldown volume. Push dominance rounds the shoulders forward and is the most common source of front-shoulder pain."},
    {a:["quads"], b:["hams"], an:"quad", bn:"hamstring", lo:0.8, hi:2.0,
     fixLow:"Add quad work — leg extensions or squats. Your hamstrings are ahead.",
     fixHigh:"Add hamstring work: RDLs and leg curls. Quad dominance well past 2:1 tracks with hamstring strains and knee complaints."},
    {a:["delts_front"], b:["delts_rear"], an:"front delt", bn:"rear delt", lo:0.6, hi:1.6,
     fixLow:"Front delts are behind — they're mostly fed by pressing, so check your press volume.",
     fixHigh:"Add rear delt work. Front delts get paid by every press you do; rear delts only grow from what you give them directly."}
  ];
  ratios.forEach(R=>{
    const sa = R.a.reduce((t,m)=>t+A.wk[m].sets,0);
    const sb = R.b.reduce((t,m)=>t+A.wk[m].sets,0);
    if(sa + sb < 6) return;                          // too little data to call it
    if(sb < 1){
      push(88, R.b[0], "No "+R.bn+" volume at all against "+r1(sa)+" sets of "+R.an+" work",
        "Your "+R.an+" work has nothing balancing it this week.", R.fixHigh);
      return;
    }
    const ratio = sa/sb;
    if(ratio > R.hi){
      push(Math.min(95, Math.round(40 + (ratio/R.hi - 1)*90)), R.b[0],
        R.bn.replace(/^./,c=>c.toUpperCase())+"s lag behind "+R.an+"s",
        r1(sa)+" sets of "+R.an+" work against "+r1(sb)+" of "+R.bn+" — a "+ratio.toFixed(1)+":1 ratio, where roughly 1:1 keeps the joint balanced.",
        R.fixHigh);
    } else if(ratio < R.lo){
      push(Math.min(95, Math.round(40 + (R.lo/ratio - 1)*90)), R.a[0],
        R.an.replace(/^./,c=>c.toUpperCase())+"s lag behind "+R.bn+"s",
        r1(sa)+" sets of "+R.an+" work against "+r1(sb)+" of "+R.bn+" ("+ratio.toFixed(2)+":1).",
        R.fixLow);
    }
  });

  // 5 — driven past what it recovers from
  MKEYS.forEach(m=>{
    const i = A.inj[m];
    if(!i || i.score < 55) return;
    push(i.score, m, MUSCLES[m].name+" "+mIs(m)+" being pushed past recovery",
      i.flags.slice(0,2).map(f=>f.t).join("; ")+".",
      "Pull it back for a week: cut the sets by about a third and keep the loads where they are. Volume you can't recover from is volume you don't grow from.");
  });

  // Most urgent first. One entry per muscle keeps the list readable — the highest
  // scoring finding for a muscle is the one worth acting on first anyway.
  const seen = new Set();
  return out.sort((a,b)=>b.score-a.score).filter(w=>{
    if(seen.has(w.muscle)) return false;
    seen.add(w.muscle); return true;
  }).slice(0, 7);
}

function profInitials(name){
  const parts = String(name||"?").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts.length===1 ? parts[0].slice(0,2) : parts[0][0]+parts[1][0]).toUpperCase();
}
function profColor(id){
  // stable colour per profile so each person is visually distinct at a glance
  const pal = ["#e05248","#4a82e0","#e8b62c","#46a85c","#b46ce0","#e07f2c","#2cc7c7","#e0629a"];
  let hs = 0;
  String(id).split("").forEach(c=>{ hs = (hs*31 + c.charCodeAt(0)) >>> 0; });
  return pal[hs % pal.length];
}

function bestSet(sets){

}

function plateLoaderHTML(a){
  const total = a.entries.length;

  const doneFin = a.entries.filter(e=>e.fin && e.sets.length && e.sets.every(st=>st.done)).length;

  const isNew = (a._loaded!=null && doneEx > a._loaded);

  const color = DAY_HEX[a.workoutId] || "#eceae4";

const C_NONE="#2a2a31", C_LOW="#3f5f8c", C_OK="#46a85c", C_WARN="#e8b62c", C_BAD="#e05248", C_FLAT="#6d6d75";
function hex2rgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lerpHex(a,b,t){
  t = Math.max(0,Math.min(1,t));
  const A=hex2rgb(a), B=hex2rgb(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function ramp(stops, t){
  // stops: [[pos,hex],...] ascending
  t = Math.max(0,Math.min(1,t));
  for(let i=1;i<stops.length;i++){
    if(t <= stops[i][0]){
      const [p0,c0]=stops[i-1], [p1,c1]=stops[i];
      return lerpHex(c0,c1,(t-p0)/((p1-p0)||1));
    }
  }
  return stops[stops.length-1][1];
}
const METRICS = [
  {id:"fatigue",  label:"Fatigue"},
  {id:"volume",   label:"Weekly Volume"},
  {id:"recovery", label:"Recovery"},
  {id:"growth",   label:"Growth"},
  {id:"injury",   label:"Injury Risk"}
];
// value (0..100 or null), colour, glow strength (0..1) and a plain-English read
function muscleMetric(A, m, metric){
  if(metric==="fatigue"){
    const v = A.fat[m];
    return {v, txt:v+"%", color:ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], v/100), glow:v/100,
      note: v>=70?"heavily fatigued":v>=45?"carrying real fatigue":v>=20?"lightly fatigued":"fresh"};
  }
  if(metric==="volume"){
    const st = A.state[m], sets = A.vol[m], M = MUSCLES[m];
    const color = st.k==="none"?C_NONE : st.k==="under"?C_LOW : st.k==="optimal"?C_OK : st.k==="high"?C_WARN : C_BAD;
    const glow = st.k==="none"?0 : st.k==="under"?.35 : st.k==="optimal"?.75 : st.k==="high"?.85 : 1;
    return {v:Math.round(Math.min(100, sets/M.mrv*100)), txt:r1(sets)+" sets", color, glow, note:st.txt};
  }
  if(metric==="recovery"){
    const v = A.rec[m];
    return {v, txt:v+"%", color:ramp([[0,C_BAD],[.5,C_WARN],[1,C_OK]], v/100), glow:1-v/100,
      note: v>=95?"fully recovered":v>=70?"mostly recovered":v>=40?"still recovering":"not recovered yet"};
  }
  if(metric==="growth"){
    const g = A.grow[m];
    if(g.score==null) return {v:null, txt:"—", color:C_NONE, glow:0, note:g.note};
    const color = ramp([[0,C_BAD],[.45,C_FLAT],[.55,C_FLAT],[1,C_OK]], g.score/100);
    const note = g.isNew ? g.note
      : g.score>=65 ? "growing — strength trending up"
      : g.score>=45 ? "holding steady"
      : "losing ground vs the last block";
    return {v:g.score, txt:(g.isNew?"new":(g.strP>=0?"+":"")+Math.round((g.strP||0)*100)+"%"), color, glow:Math.abs(g.score-50)/50, note};
  }
  const v = A.inj[m].score;
  return {v, txt:v+"%", color:ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], v/100), glow:v/100,
    note: v>=75?"high risk — back off":v>=55?"elevated risk":v>=30?"some risk flags":"low risk"};
}
function metricLegend(metric){
  const sw = (c,t)=>`<span class="bm-lg"><span class="bm-sw" style="background:${c}"></span>${t}</span>`;
  if(metric==="volume"){
    return sw(C_NONE,"none")+sw(C_LOW,"below MEV")+sw(C_OK,"MEV–MAV")+sw(C_WARN,"above MAV")+sw(C_BAD,"over MRV");
  }
  if(metric==="growth"){
    return sw(C_BAD,"losing ground")+sw(C_FLAT,"steady")+sw(C_OK,"growing")+sw(C_NONE,"no data");
  }
  if(metric==="recovery"){
    return sw(C_BAD,"not recovered")+sw(C_WARN,"partway")+sw(C_OK,"ready");
  }
  return sw(C_OK,"low")+sw(C_WARN,"moderate")+sw(C_BAD,"high");
}

  let h = `<div class="hdr"><h1>Body</h1>${hdrRight()}</div>`;
  if(!S.sessions.length){
    return h + `<div class="empty">Log a workout or two and this map fills in — fatigue, weekly volume per muscle, recovery, growth and injury risk, all read straight from your sets.</div>`;
  }
  const A = bodyAnalysis();

  // metric picker
  h += `<div class="metric-scroll"><div class="metric-seg">${
    METRICS.map(m=>`<button data-metric="${m.id}" class="${m.id===metric?"on":""}">${m.label}</button>`).join("")
  }</div></div>`;

  // the figure
  h += `<div class="card bm-card">
    <div class="bm-figs">
      <div class="bm-fig">${bodyFrontSVG(A, metric)}<div class="bm-fig-label">front</div></div>
      <div class="bm-fig">${bodyBackSVG(A, metric)}<div class="bm-fig-label">back</div></div>
    </div>
    <div class="bm-legend">${metricLegend(metric)}</div>
    <div class="bm-explain">${METRIC_BLURB[metric]}</div>
    <div class="bm-explain" style="color:var(--faint);font-size:12.5px">Tap any muscle — on the figure or in the list — for its full breakdown.</div>
  </div>`;

  // systemic tiles
  const t = A.totals;
  const acwrNote = t.acwr==null ? "needs 4 weeks of history"
    : t.acwr > 1.5 ? "spiking — above the 1.5× injury marker"
    : t.acwr < 0.8 ? "backing off — this week is well under your norm"
    : "inside the safe 0.8–1.5 band";
  h += `<div class="card">
    <h3 style="font-size:17px">Whole-body load</h3>
    <div class="sys-grid">
      <div class="sys-tile"><div class="sys-k">Working sets · 7 days</div>
        <div class="sys-v">${t.setsWk}</div>
        <div class="sys-s">${t.setsPrev>0?(t.setsWk>=t.setsPrev?"+":"")+Math.round((t.setsWk-t.setsPrev)/t.setsPrev*100)+"% vs the week before":"first week on record"}</div></div>
      <div class="sys-tile"><div class="sys-k">Acute : chronic</div>
        <div class="sys-v" style="color:${t.acwr==null?"var(--dim)":(t.acwr>1.5||t.acwr<0.8)?"var(--arms)":"var(--ok)"}">${t.acwr==null?"—":t.acwr.toFixed(2)+"×"}</div>
        <div class="sys-s">${acwrNote}</div></div>
      <div class="sys-tile"><div class="sys-k">Mean fatigue</div>
        <div class="sys-v" style="color:${ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], t.fat/100)}">${t.fat}%</div>
        <div class="sys-s">${t.fat>=60?"systemically fatigued — a lighter week would pay off":t.fat>=35?"normal mid-block fatigue":"fresh across the board"}</div></div>
      <div class="sys-tile"><div class="sys-k">Peak injury flag</div>
        <div class="sys-v" style="color:${ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], t.inj/100)}">${t.inj}%</div>
        <div class="sys-s">${t.inj>=55?"at least one muscle is being pushed past recovery":"nothing flagged above moderate"}</div></div>
    </div>
    ${A.modInfo.why.length?`<div class="bm-explain">Recovery adjusted for your check-ins: ${esc(A.modInfo.why.join("; "))}.</div>`:
      `<div class="bm-explain" style="color:var(--faint)">Log weight, sleep and energy in your daily check-in and recovery gets adjusted for them.</div>`}
  </div>`;

  // ranked list for the current metric
  const rows = MKEYS.map(m=>({m, mm:muscleMetric(A, m, metric)}));
  const dir = (metric==="recovery"||metric==="growth") ? 1 : -1;   // worst-first either way
  rows.sort((a,b)=>{
    const av = a.mm.v==null?-1:a.mm.v, bv = b.mm.v==null?-1:b.mm.v;
    return dir===1 ? av-bv : bv-av;
  });
  h += `<div class="card">
    <h3 style="font-size:17px">${METRICS.find(x=>x.id===metric).label} by muscle</h3>
    <div class="sub" style="margin:2px 0 8px">${dir===1?"Lowest first":"Highest first"} — the ones asking for attention are at the top.</div>
    <div class="bm-rank">`;
  rows.forEach(({m, mm})=>{
    const pct = mm.v==null ? 0 : mm.v;
    h += `<div class="bm-row" data-mrow="${m}">
      <span class="bm-name">${esc(MUSCLES[m].name)}</span>
      <span class="bm-bar"><i style="width:${Math.max(2,pct)}%;background:${mm.color}"></i></span>
      <span class="bm-val">${esc(mm.txt)}</span>
    </div>`;
  });
  h += `</div></div>`;

  // weak points
  /* Weak points need a real week behind them. With two sessions logged, almost every
     muscle looks "untrained" and the list would be a wall of alarming noise about a
     program that's simply mid-rotation — so it waits until there's enough to judge. */
  const spanDays = (Date.now() - S.sessions[0].startedAt)/DAY_MS;
  const enough = S.sessions.length >= 4 && spanDays >= 6;
  h += `<div class="card">
    <h3 style="font-size:17px">Weak point detection</h3>
    <div class="sub" style="margin:2px 0 12px">Muscles that are under-stimulated, stalled, out of balance with their opposite, missing from your program, or being driven past recovery.</div>`;
  if(!enough){
    h += `<div class="sub" style="padding:6px 0 2px">Still gathering data — this needs at least 4 sessions across a full week before it can tell a genuine weak point from a rotation that simply hasn't come around yet. You're at ${S.sessions.length} session${S.sessions.length===1?"":"s"} over ${Math.max(1,Math.round(spanDays))} day${Math.round(spanDays)===1?"":"s"}.</div>`;
  } else if(!A.weak.length){
    h += `<div class="sub" style="padding:6px 0 2px">Nothing flagged. Every muscle in the model is inside its productive volume range, balanced against its opposite, and progressing or holding. Keep going.</div>`;
  } else {
    A.weak.forEach(w=>{
      const sevTxt = w.sev>=3?"high priority":w.sev===2?"worth fixing":"minor";
      h += `<div class="wp sev${w.sev}">
        <div class="wp-head"><b>${esc(w.title)}</b><span class="wp-sev">${sevTxt}</span></div>
        <div class="wp-why">${esc(w.why)}</div>
        <div class="wp-fix"><b>Do this</b> — ${esc(w.fix)}</div>
      </div>`;
    });
  }
  h += `</div>`;
  return h;
}
function openMuscleDetail(m){
  const A = bodyAnalysis();
  const M = MUSCLES[m], wk = A.wk[m], st = A.state[m], g = A.grow[m], inj = A.inj[m];
  const lastTxt = wk.lastMs
    ? (()=>{ const hrs = Math.round((Date.now()-wk.lastMs)/3600e3);
             return hrs < 48 ? hrs+" h ago" : Math.round(hrs/24)+" days ago"; })()
    : "not in the last 7 days";
  const line = (k, v, c)=>`<div class="rev-line"><b>${k}</b><span class="num"${c?` style="color:${c}"`:""}>${v}</span></div>`;
  const fatC = ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], A.fat[m]/100);
  const recC = ramp([[0,C_BAD],[.5,C_WARN],[1,C_OK]], A.rec[m]/100);
  const injC = ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], inj.score/100);
  let h = `<h3>${esc(M.name)}</h3>
  <div class="sub" style="margin:-4px 0 10px">Last trained ${esc(lastTxt)} · MEV ${M.mev} / MAV ${M.mav} / MRV ${M.mrv} sets per week · recovery window ≈ ${M.recov} h</div>
  <div class="rev-head">This week</div>
  ${line("Hard sets", r1(wk.sets)+" / "+M.mrv, muscleMetric(A,m,"volume").color)}
  ${line("Volume", Math.round(wk.vol).toLocaleString()+" lb")}
  ${line("Sets to failure (RPE 9.5+)", r1(wk.nearFail))}
  <div class="rev-head">Right now</div>
  ${line("Fatigue", A.fat[m]+"%", fatC)}
  ${line("Recovery", A.rec[m]+"%", recC)}
  ${line("Injury risk", inj.score+"%", injC)}
  ${line("Growth", g.score==null?"no recent data":(g.isNew?"first block":(g.strP>=0?"+":"")+Math.round(g.strP*100)+"% est. 1RM"), g.score==null?null:ramp([[0,C_BAD],[.5,C_FLAT],[1,C_OK]], g.score/100))}
  <div class="bm-explain">${esc(st.txt.charAt(0).toUpperCase()+st.txt.slice(1))}. ${esc(muscleMetric(A,m,"fatigue").note.replace(/^./,c=>c.toUpperCase()))}, ${esc(muscleMetric(A,m,"recovery").note)}.</div>`;
  if(inj.flags.length){
    h += `<div class="rev-head">Risk flags</div><div class="sc-why"><ul>${inj.flags.map(f=>`<li>${esc(f.t)}</li>`).join("")}</ul></div>`;
  }
  const exs = Object.keys(wk.exs).sort((a,b)=>wk.exs[b]-wk.exs[a]);
  if(exs.length){
    h += `<div class="rev-head">What's feeding it</div>`;
    exs.forEach(n=> h += `<div class="rev-line"><b>${esc(n)}</b><span class="num">${r1(wk.exs[n])} sets</span></div>`);
  } else {
    h += `<div class="rev-head">What's feeding it</div><div class="sub">Nothing in the last 7 days.</div>`;
  }
  const spanDays = S.sessions.length ? (Date.now() - S.sessions[0].startedAt)/DAY_MS : 0;
  const mine = (S.sessions.length >= 4 && spanDays >= 6) ? A.weak.filter(w=>w.muscle===m) : [];
  if(mine.length){
    h += `<div class="rev-head">Flagged</div>`;
    mine.forEach(w=> h += `<div class="wp sev${w.sev}"><div class="wp-head"><b>${esc(w.title)}</b></div><div class="wp-why">${esc(w.why)}</div><div class="wp-fix"><b>Do this</b> — ${esc(w.fix)}</div></div>`);
  }
  h += `<button class="btn" style="margin-top:16px" id="closeModal">Done</button>`;
  showModal(h);
  MODAL_REOPEN = ()=> openMuscleDetail(m);   // so a term tapped in here can come back
}

/* ================= EVENTS ================= */
/* Glossary — one delegated listener for the whole app, so every dotted-underlined term
   keeps working through every re-render. Terms can appear inside other modals (the
   muscle breakdown links to MEV, the injury entry links to ACWR), so the entry offers a
   Back button that rebuilds whatever was showing rather than leaving a dead end. */
function openGlossary(id){
  const g = GLOSSARY[id];
  if(!g) return;
  const back = MODAL_REOPEN;                                  // capture before we replace
  const pending = MODAL_DISMISS;                              // eg. the post-workout chain
  const wasOpen = $("#modalBg").classList.contains("show");
  const foot = (wasOpen && back)
    ? `<div class="btn-row" style="margin-top:18px"><button class="btn small" id="glBack">‹ Back</button></div>
       <div class="btn-row"><button class="btn ghost small" id="closeModal">Close</button></div>`
    : `<button class="btn" style="margin-top:18px" id="closeModal">Got it</button>`;
  showModal(`<h3>${g.title}</h3>${g.html}${foot}`);
  MODAL_REOPEN = back;                                        // keep it for nested terms
  const b = $("#glBack");
  if(b) b.onclick = ()=>{ if(back) back(); };
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-term]");
  if(t){ e.stopPropagation(); openGlossary(t.dataset.term); return; }
  if(e.target.closest(".rpe-help")) openGlossary("rpe");
});
// keyboard access for the inline terms
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest && e.target.closest("[data-term]");
  if(t){ e.preventDefault(); openGlossary(t.dataset.term); }
});

function bind(){
  const pb = $("#profBar");
  if(pb) pb.onclick = openProfilePicker;
  const pm = $("#profMini");
  if(pm) pm.onclick = openProfilePicker;
  document.querySelectorAll(".plate").forEach(p=>{
    p.onclick = ()=>{
      if(S.active){ toast("Finish or discard the current workout first"); return; }
      const slot = parseInt(p.dataset.slot,10);
      if(S.cycleDone.includes(slot)) toast("Heads up — you've already done this one this cycle");
      S.pointer = slot;
      S.override = null;
      save(); queueSync(); render();
    };
  });
  const cyc = $("#cycleReset");
  if(cyc) cyc.onclick = ()=>{
    if(confirm("Start a fresh cycle? All checkmarks clear (your history is untouched).")){
      S.cycleStart = Date.now();
      S.cycleDone = [];
      S.restDay = null;
      save(); queueSync(); render();
    }
  };
  const lrev = $("#lastReviewBtn");
  if(lrev) lrev.onclick = ()=> openCycleReview(S.lastReview);
  const rp = $("#restPlate");
  if(rp) rp.onclick = ()=>{
    if(S.active){ toast("Finish or discard the current workout first"); return; }
    const used = S.restDay && S.restDay.date;
    if(!used){
      if(confirm("Take today as your rest day? You get one per cycle.")){
        S.restDay = {date: todayStr()};
        // also log it permanently so it survives cycle resets and shows in History
        if(!S.restLog.includes(todayStr())){ S.restLog.push(todayStr()); S.restLog.sort(); }
        save(); queueSync(); render();
      }
    } else if(S.restDay.date === todayStr()){
      if(confirm("Cancel today's rest day?")){
        S.restLog = S.restLog.filter(d=>d!==S.restDay.date);
        S.restDay = null;
        save(); queueSync(); render();
      }
    } else {
      toast("Rest day already used this cycle ("+fmtDate(S.restDay.date)+")");
    }
  };
  const ur = $("#undoRestBtn");
  if(ur) ur.onclick = ()=>{
    // decided to train after all → this wasn't a rest day, so unlog it too
    if(S.restDay && S.restDay.date) S.restLog = S.restLog.filter(d=>d!==S.restDay.date);
    S.restDay = null;
    save(); queueSync(); render();
  };
  const crb = $("#clearRestBtn");
  if(crb) crb.onclick = ()=>{
    // frees the per-cycle allowance but keeps the day in the permanent rest log —
    // you still rested that day, you're just allowing another rest this cycle.
    if(confirm("Free up this cycle's rest day so you can take another? The day stays in your rest history — remove it in Settings if it was a mistake.")){
      S.restDay = null;
      save(); queueSync(); render();
    }
  };

  const start = $("#startBtn");
  if(start) start.onclick = ()=> startWorkout(todaysWorkoutId());

  const swap = $("#swapBtn");
  if(swap) swap.onclick = openPicker;
  const goR = $("#goRestore");
  if(goR) goR.onclick = ()=>{
    TAB = "sync";
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="sync"));
    render();
    setTimeout(()=>{ const t=$("#tokenIn"); if(t) t.focus(); }, 60);
  };

  ["ciW","ciS","ciE"].forEach(id=>{
    const el = $("#"+id);
    if(el) el.onchange = ()=>{
      const d = todayStr();
      const ci = S.checkins[d] || {};
      if(id==="ciW") ci.weight = el.value.trim();
      if(id==="ciS") ci.sleep = el.value.trim();
      if(id==="ciE") ci.energy = el.value;
      S.checkins[d] = ci;
      save(); queueSync();
    };
  });

  document.querySelectorAll(".set input, .set select").forEach(el=>{
    if(el.dataset.e==null) return;      // skip the session-editor's own rows
    el.onchange = ()=>{
      const ei = parseInt(el.dataset.e,10), si = parseInt(el.dataset.s,10), f = el.dataset.f;
      const st = S.active.entries[ei].sets[si];
      const before = st.pr || null;
      st[f] = el.value;
      if(String(el.value).trim() !== "") markPriorDone(ei, si);
      // Typing a heavier weight (or more reps) onto an already-ticked set is a PR path
      // the old code never looked at. Re-check the whole exercise, then surface it.
      if(st.done && (f==="weight" || f==="reps")){
        refreshPRs(ei);
        if(st.pr && st.pr !== before){
          const chk = document.querySelector(`.set .chk[data-e="${ei}"][data-s="${si}"]`);
          if(chk) prFloat(chk, st.pr);
          drawPRBadges(ei);
        } else if(!st.pr && before){
          drawPRBadges(ei);
        }
      }
      save();
    };
  });
  document.querySelectorAll(".set .chk").forEach(el=>{
    el.onclick = async ()=>{
      const ei = parseInt(el.dataset.e,10), si = parseInt(el.dataset.s,10);
      const entry = S.active.entries[ei];
      const wasComplete = entry.sets.length && entry.sets.every(x=>x.done);
      const st = entry.sets[si];
      // About to log a set while a rest timer for a DIFFERENT set is barely started?
      // That means the last rest was ~nothing — ask before it gets recorded, using the
      // rest target for the set that's actually resting.
      if(!st.done && !entry.superset){
        const rt = S.active.restTimer;
        if(rt && !(rt.e===ei && rt.s===si)){
          if(!(await confirmShortRest(restElapsed(), "log this next set"))) return;
        }
      }
      st.done = !st.done;
      if(st.done){
        const row = el.parentElement;
        const wIn = row.querySelector('[data-f="weight"]');
        const rIn = row.querySelector('[data-f="reps"]');
        if(!st.weight && wIn.placeholder && wIn.placeholder!=="lbs"){ st.weight=wIn.placeholder; wIn.value=wIn.placeholder; }
        if(!st.reps && rIn.placeholder && rIn.placeholder!=="reps"){ st.reps=rIn.placeholder; rIn.value=rIn.placeholder; }
        // PR spark — compared against your ALL-TIME best for this exercise, and now
        // recorded on the set so it also shows as a badge and in the session summary.
        checkPR(ei, si, el);
        // the ✓ is the stopwatch trigger — but never inside a superset (no rest between/after)
        if(!entry.superset) startRest(ei, si);
      } else {
        // unchecking: cancel its running timer and clear its recorded rest
        const rt = S.active.restTimer;
        if(rt && rt.e===ei && rt.s===si){ S.active.restTimer=null; hideRestUI(); }
        delete st.rest;
        delete st.pr;
      }
      el.classList.toggle("on", st.done);
      refreshPRs(ei);
      drawPRBadges(ei);
      save();
      const isComplete = entry.sets.length && entry.sets.every(x=>x.done);
      if(S.viewMode==="focus" && wasComplete !== isComplete){
        // completion flipped → the barbell gains/loses a plate
        const doShake = isComplete;
        render();
        if(doShake && !reducedMotion()){

          setTimeout(()=>document.body.classList.remove("shake"), 600);
        }
      }
    };

/* ---------- workout flow ---------- */
function startWorkout(wid){
  // lock in this session's starting arm now, so it can't shift if the session count
  // changes later (e.g. resuming from history splices a session out of the list).
  const side = startSideFor(wid);
  S.active = {
    id: uid(),
    workoutId: wid,
    date: todayStr(),
    startedAt: Date.now(),
    entries: resolvedProgram(wid).map(({chosen:e, isFinisher})=>({
      name: e.name, reps: e.reps, rpe: e.rpe, note: e.note, fin: isFinisher||undefined,
      superset: e.superset||undefined, supersetEnd: e.supersetEnd||undefined,
      startSide: isSingleArm(e) ? side : undefined,
      sets: Array.from({length:e.sets}, ()=>({weight:"",reps:"",rpe:"",done:false}))
    }))
  };
  save(); render();
}
function resumeSession(id){
  const idx = S.sessions.findIndex(s=>s.id===id);
  if(idx<0) return;
  const s = S.sessions[idx];
  if(s.date !== todayStr()){ toast("You can only resume today's workout"); return; }
  if(S.active && !confirm("You have a workout in progress — replace it with this one?")) return;
  // pull the finished session back into an active, editable session
  S.active = {
    id: s.id,
    workoutId: s.workoutId,
    date: s.date,
    startedAt: s.startedAt,
    note: s.note||"",
    feel: s.feel||null,
    focusIdx: 0,
    restTimer: null,
    entries: s.entries.map(e=>({
      name: e.name, reps: e.reps, rpe: e.rpe, note: e.note, fin: e.fin||undefined,
      startSide: isSingleArm(e) ? (e.startSide || startSideFor(s.workoutId)) : undefined,
      sets: e.sets.map(st=>Object.assign({}, st))
    }))
  };
  S.sessions.splice(idx,1); // remove from history while it's live again
  recomputeCycle(false);
  save(); queueSync();
  TAB = "today";
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="today"));
  render();
  window.scrollTo(0,0);
  toast("Workout resumed — finish again when you're done");
}
function finishWorkout(){
  const a = S.active;
  const logged = a.entries.some(e=>e.sets.some(st=>st.done || st.reps));
  if(!logged){
    if(!confirm("No sets logged yet — finish anyway?")) return;
  } else if(!confirm("Complete your workout? This saves the session to your history.")){
    return;
  }
  if(a.restTimer){ a.restTimer = null; hideRestUI(); }
  a.entries.forEach(e=>{ e.sets = e.sets.filter(st=>st.done || st.reps || st.weight); });
  a.entries = a.entries.filter(e=>e.sets.length);
  a.finishedAt = Date.now();
  const wid = a.workoutId;
  const noteEl = $("#sessNote");
  if(noteEl) a.note = noteEl.value.trim();
  const vol = a.entries.reduce((t,e)=>t+e.sets.reduce((u,st)=>u+((parseFloat(st.weight)||0)*(parseFloat(st.reps)||0)),0),0);
  const sessObj = {id:a.id, workoutId:a.workoutId, date:a.date, startedAt:a.startedAt, finishedAt:a.finishedAt, entries:a.entries, note:a.note||"", feel:a.feel||null};
  const existing = S.sessions.findIndex(x=>x.id===a.id);
  if(existing>=0) S.sessions.splice(existing,1);
  S.sessions.push(sessObj);
  S.sessions.sort((x,y)=>x.startedAt-y.startedAt);
  S.active = null;
  // graded once, at the moment it's finished, and stored on the session so History
  // shows the same number later even as the surrounding history grows
  sessObj.quality = scoreWorkout(sessObj);
  const cycleFinished = recomputeCycle(true);
  S.override = null;
  save(); render();
  // celebration → quality score → cycle wrapped, each waiting for the last
  const afterScore = ()=>{
    if(cycleFinished && S.lastReview) setTimeout(()=>openCycleReview(S.lastReview), 250);
  };
  celebrate(cycleFinished ? "cycle" : "workout", wid, Math.round(vol),
            ()=> setTimeout(()=>openScoreCard(sessObj, afterScore), 260));
  toast("Workout saved 💪");
  if(S.sync.gistId) syncNow(false);
  if(S.sync.repo) repoBackup(false);
}
function recomputeCycle(announce){
  // the cycle's checkmarks are always derived from actual logged sessions since cycleStart
  const done = [];
  S.sessions
    .filter(s=>s.startedAt >= S.cycleStart)
    .sort((a,b)=>a.startedAt-b.startedAt)
    .forEach(s=>{
      for(let i=0;i<ROTATION.length;i++){
        if(ROTATION[i]===s.workoutId && !done.includes(i)){ done.push(i); break; }
      }
    });
  if(done.length >= ROTATION.length){
    // full cycle in the books → capture the review, then start fresh
    S.lastReview = buildCycleReview();
    S.lastCycle = {start:S.cycleStart, end:Date.now()};
    S.cycleStart = Date.now();
    S.cycleDone = [];
    S.restDay = null;
    if(announce) toast("Cycle complete — starting a fresh one 🔁");
    save();   // real transition — mark as a change worth syncing
    return true;
  } else {
    S.cycleDone = done;
  }
  // if the suggested day is already done, move to the next unchecked one
  if(S.cycleDone.includes(S.pointer)){
    for(let k=1;k<=ROTATION.length;k++){
      const idx = (S.pointer+k)%ROTATION.length;
      if(!S.cycleDone.includes(idx)){ S.pointer = idx; break; }
    }
  }
  saveQuiet();   // derived recomputation — don't claim a newer change on every boot
  return false;
}
function openPicker(){
  let h = `<h3>Pick today's workout</h3><div class="picker">`;
  Object.keys(META).forEach(id=>{
    h += `<button data-pick="${id}"><span class="dot" style="background:${META[id].color}"></span>${META[id].name}</button>`;
  });
  h += `</div><button class="btn ghost" style="margin-top:14px" id="closeModal">Cancel</button>`;
  showModal(h);
  document.querySelectorAll("[data-pick]").forEach(b=> b.onclick=()=>{
    S.override = {date: todayStr(), workoutId: b.dataset.pick};
    save(); hideModal(); render();
  });
}

  let h = `<h3>${isNew?"Add":"Edit"} exercise — ${widName(wid)}</h3>

  </div></div>

    <input id="f_rpe" value="${esc(e.rpe)}" placeholder="8-9">
