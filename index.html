  <div class="togglerow"><input type="checkbox" id="f_uni" ${isSingleArm(e)?"checked":""}><label for="f_uni" style="margin:0;font:inherit;color:var(--text);text-transform:none;letter-spacing:0">One limb at a time — show a RIGHT/LEFT start-side tip that flips each session</label></div>
  <div class="togglerow"><input type="checkbox" id="f_hasAlt" ${e.alt?"checked":""}><label for="f_hasAlt" style="margin:0;font:inherit;color:var(--text);text-transform:none;letter-spacing:0">Alternates with a second exercise every other ${dayLabel}</label></div>
  <div id="altFields" style="display:${e.alt?"block":"none"};border-top:1px solid var(--line);padding-top:12px">
    <div class="field"><label>Alternate name</label><input id="g_name" value="${esc(alt.name)}"></div>
    <div class="field"><label>Sets / rep range</label><div class="duo">
      <input id="g_sets" inputmode="numeric" value="${alt.sets}" placeholder="sets">
      <input id="g_reps" value="${esc(alt.reps)}" placeholder="5-8">
    </div></div>
    <div class="field"><label>Target RPE / starting weight (lb)</label><div class="duo">
      <input id="g_rpe" value="${esc(alt.rpe)}" placeholder="8-9">
      <input id="g_weight" inputmode="decimal" value="${alt.weight??""}" placeholder="blank = bodyweight">
    </div></div>
    <div class="field"><label>Note</label><input id="g_note" value="${esc(alt.note)}" placeholder=""></div>
  </div>
  <div class="btn-row">
    <button class="btn small" id="saveEx">Save</button>
    ${isNew?"":'<button class="btn ghost small danger" id="delEx">Delete</button>'}
    <button class="btn ghost small" id="closeModal">Cancel</button>
  </div>`;
  showModal(h);
  $("#f_hasAlt").onchange = ev=>{ $("#altFields").style.display = ev.target.checked ? "block" : "none"; };
  $("#saveEx").onclick = ()=>{
    const ne = {
      name: $("#f_name").value.trim(),
      sets: Math.max(1, parseInt($("#f_sets").value,10)||3),
      reps: $("#f_reps").value.trim(),
      rpe: $("#f_rpe").value.trim(),
      weight: $("#f_weight").value===""?null:parseFloat($("#f_weight").value),
      note: $("#f_note").value.trim()
    };
    if(!ne.name){ toast("Name it first"); return; }
    // store uni only when it disagrees with the built-in table, so the table can
    // keep improving for exercises the user never touched
    const uniWanted = $("#f_uni").checked;
    if(uniWanted !== isSingleArm({name:ne.name, note:ne.note})) ne.uni = uniWanted;
    if($("#f_hasAlt").checked){
      const na = {
        name: $("#g_name").value.trim(),
        sets: Math.max(1, parseInt($("#g_sets").value,10)||3),
        reps: $("#g_reps").value.trim(),
        rpe: $("#g_rpe").value.trim(),
        weight: $("#g_weight").value===""?null:parseFloat($("#g_weight").value),
        note: $("#g_note").value.trim()
      };
      if(!na.name){ toast("Name the alternate too"); return; }
      ne.alt = na;
    }
    if(isNew) S.program[wid].push(ne); else S.program[wid][idx]=ne;
    save(); queueSync(); hideModal(); render();
  };
  const del = $("#delEx");
  if(del) del.onclick = ()=>{
    if(confirm("Remove this exercise from the program? Past logs keep it.")){
      S.program[wid].splice(idx,1); save(); queueSync(); hideModal(); render();
    }
  };
}
function moveEx(wid, idx, dir){
  idx = parseInt(idx,10);
  const arr = S.program[wid], j = idx+dir;
  if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]]=[arr[j],arr[idx]];
  save(); queueSync(); render();
}

/* Move an exercise up or down inside a finished session. Order matters for reading a
   session back — and for the quality score's fatigue-management read — so it's editable
   after the fact, both from the History card and inside the session editor. */
function moveSessEx(sessId, idx, dir, silent){
  const s = S.sessions.find(x=>x.id===sessId);
  if(!s) return false;
  idx = parseInt(idx,10);
  const j = idx + dir;
  if(j < 0 || j >= s.entries.length) return false;
  [s.entries[idx], s.entries[j]] = [s.entries[j], s.entries[idx]];
  s.edited = Date.now();
  save(); queueSync();
  if(!silent){
    // keep this card open across the re-render so you can keep nudging
    render();
    const card = document.querySelector(`.sess[data-sess="${sessId}"]`);
    if(card) card.classList.add("open");
  }
  return true;
}

/* ---------- session editor (edit history) ---------- */
function allExerciseNames(){
  const set = new Set();
  Object.keys(S.program).forEach(k=>{
    S.program[k].forEach(e=>{
      if(e.name) set.add(e.name);
      if(e.alt && e.alt.name) set.add(e.alt.name);
    });
  });
  S.sessions.forEach(s=>s.entries.forEach(e=>set.add(e.name)));
  return [...set].filter(n=>n && !/round 2/i.test(n)).sort((a,b)=>a.localeCompare(b));
}
function openSessionEditor(id){
  const s = S.sessions.find(x=>x.id===id);
  if(s) renderSessEditor(s);
}
function renderSessEditor(s){
  let h = `<h3>Edit session — ${META[s.workoutId].name}, ${fmtDate(s.date)}</h3>
  <div class="field"><label>Session note</label><input id="sessNoteEdit" value="${esc(s.note||"")}" placeholder="optional"></div>
  <div class="field"><label>How did it feel?</label>
    <div class="feel-row" style="margin-top:2px">${FEELS.map((f,i)=>`<button class="feel-btn ${s.feel===i+1?"on":""}" data-feele="${i+1}">${f}</button>`).join("")}</div>
  </div>`;
  if(s.entries.length){
    h += `<div class="sub" style="margin:2px 0 6px">Use ↑ ↓ to put the exercises back in the order you actually did them.</div>`;
    h += s.entries.map((e,i)=>`<div class="prog-ex">
      <div style="min-width:0"><b>${esc(e.name)}</b><div class="meta">${e.sets.map(fmtSetShort).map(esc).join("  |  ")||"no sets"}</div></div>
      <div class="icon-btns">
        <button data-seup="${i}" aria-label="Move up" ${i===0?"disabled style=opacity:.35":""}>↑</button>
        <button data-sedown="${i}" aria-label="Move down" ${i===s.entries.length-1?"disabled style=opacity:.35":""}>↓</button>
        <button data-rmex="${i}" aria-label="Remove">✕</button>
      </div>
    </div>`).join("");
  } else {
    h += `<div class="empty">No exercises in this session.</div>`;
  }
  h += `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px">
    <div class="field"><label>Add an exercise</label>
      <select id="addExSel" style="width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px">
        ${allExerciseNames().map(n=>`<option>${esc(n)}</option>`).join("")}
        <option value="__custom__">Custom — type my own…</option>
      </select>
    </div>
    <div class="field" id="customWrap" style="display:none"><label>Custom exercise name</label><input id="customName" placeholder="e.g. Face Pulls"></div>
    <div id="newSets"></div>
    <div class="btn-row">
      <button class="btn ghost small" id="plusSet">+ set</button>
      <button class="btn small" id="addToSess">Add to session</button>
    </div>
  </div>
  <button class="btn" style="margin-top:16px" id="closeModal">Done</button>`;
  showModal(h);

  let newSets = [{weight:"",reps:"",rpe:""}];
  const drawSets = ()=>{
    $("#newSets").innerHTML = `<div class="set-labels"><span>set</span><span>lbs</span><span>reps</span><span>rpe</span><span></span></div>` +
      newSets.map((st,i)=>`<div class="set"><span class="idx">${i+1}</span>
        <input inputmode="decimal" data-ns="${i}" data-f="weight" value="${st.weight}" placeholder="lbs">
        <input inputmode="numeric" data-ns="${i}" data-f="reps" value="${st.reps}" placeholder="reps">
        <select data-ns="${i}" data-f="rpe">${rpeOptions(st.rpe)}</select><span></span></div>`).join("");
    document.querySelectorAll("#newSets input, #newSets select").forEach(el=>{
      el.onchange = ()=>{ newSets[el.dataset.ns][el.dataset.f] = el.value; };
    });
  };
  drawSets();

  const harvest = ()=>{
    document.querySelectorAll("#newSets [data-ns]").forEach(el=>{
      newSets[el.dataset.ns][el.dataset.f] = el.value;
    });
  };

  const ne = $("#sessNoteEdit");
  if(ne) ne.onchange = ()=>{ s.note = ne.value.trim(); s.edited = Date.now(); save(); queueSync(); };
  document.querySelectorAll("#modal [data-feele]").forEach(b=> b.onclick=()=>{
    const v = parseInt(b.dataset.feele,10);
    s.feel = s.feel===v ? null : v;
    s.edited = Date.now();
    save(); queueSync();
    document.querySelectorAll("#modal [data-feele]").forEach(x=>x.classList.toggle("on", parseInt(x.dataset.feele,10)===s.feel));
  });

  $("#addExSel").onchange = ev=>{ $("#customWrap").style.display = ev.target.value==="__custom__" ? "block" : "none"; };
  $("#plusSet").onclick = ()=>{ harvest(); newSets.push({weight:"",reps:"",rpe:""}); drawSets(); };
  document.querySelectorAll("[data-rmex]").forEach(b=> b.onclick=()=>{
    if(confirm("Remove this exercise from the session?")){
      s.entries.splice(parseInt(b.dataset.rmex,10),1);
      s.edited = Date.now();
      save(); queueSync();
      renderSessEditor(s);
    }
  });
  document.querySelectorAll("[data-seup]").forEach(b=> b.onclick=()=>{
    if(moveSessEx(s.id, b.dataset.seup, -1, true)) renderSessEditor(s);
  });
  document.querySelectorAll("[data-sedown]").forEach(b=> b.onclick=()=>{
    if(moveSessEx(s.id, b.dataset.sedown, 1, true)) renderSessEditor(s);
  });
  $("#addToSess").onclick = ()=>{
    harvest();
    let name = $("#addExSel").value;
    if(name==="__custom__") name = $("#customName").value.trim();
    if(!name){ toast("Pick or name an exercise first"); return; }
    const sets = newSets.filter(st=>String(st.reps).trim()||String(st.weight).trim()).map(st=>({weight:st.weight, reps:st.reps, rpe:st.rpe, done:true}));
    if(!sets.length){ toast("Fill in at least one set"); return; }
    s.entries.push({name, sets});
    s.edited = Date.now();
    save(); queueSync();
    renderSessEditor(s);
    toast("Added "+name);
  };
  $("#closeModal").onclick = ()=>{
    hideModal(); render();
    if(S.sync.repo) repoBackup(false);
  };
}

/* =====================================================================
   WORKOUT QUALITY SCORE

   Eight sections, 100 points, each one grading something with an actual evidence base
   behind it rather than a vibe. Every section reports its own grade and the reasoning,
   so the number is auditable — you can always see which points you left on the table.

     1. Completion .............. 15   did the planned work get done
     2. Progressive overload .... 15   did it beat the last time
     3. Effective intensity ..... 14   were sets close enough to failure to count
     4. Rest discipline ......... 14   rest matched to what each set demanded
     5. Rep-range adherence ..... 10   sets landing in their prescribed range
     6. Fatigue management ...... 10   performance held across sets
     7. Session efficiency ...... 12   duration and density
     8. Log quality ............. 10   RPE, feel, note, check-in, timer use
   ===================================================================== */
function gradeFor(pct){
  if(pct >= .97) return "A+";
  if(pct >= .93) return "A";
  if(pct >= .90) return "A−";
  if(pct >= .87) return "B+";
  if(pct >= .83) return "B";
  if(pct >= .80) return "B−";
  if(pct >= .77) return "C+";
  if(pct >= .73) return "C";
  if(pct >= .70) return "C−";
  if(pct >= .60) return "D";
  return "F";
}
function gradeColor(pct){
  return ramp([[0,C_BAD],[.6,C_BAD],[.75,C_WARN],[.9,C_OK],[1,C_OK]], pct);
}
function repRange(str){
  const m = String(str||"").match(/(\d+)\s*[-–]\s*(\d+)/);
  if(m) return [parseInt(m[1],10), parseInt(m[2],10)];
  const one = String(str||"").match(/(\d+)/);
  return one ? [parseInt(one[1],10), parseInt(one[1],10)] : null;
}
// The previous session of the same rotation day — what "did I progress?" measures against.
function priorSessionFor(sess){
  let best = null;
  S.sessions.forEach(s=>{
    if(s.id === sess.id) return;
    if(s.workoutId !== sess.workoutId) return;
    if(s.startedAt >= sess.startedAt) return;
    if(!best || s.startedAt > best.startedAt) best = s;
  });
  return best;
}
function scoreWorkout(sess){
  const secs = [];
  const add = (key, label, max, earned, why, tip)=>{
    const pts = Math.max(0, Math.min(max, earned));
    secs.push({key, label, max, pts:Math.round(pts*10)/10, pct:pts/max,
               grade:gradeFor(pts/max), why:why.filter(Boolean), tip});
  };
  const entries = sess.entries || [];
  const allSets = [];
  entries.forEach(e=> e.sets.forEach(st=>{ if(isWorkingSet(st)) allSets.push({e, st}); }));
  const nSets = allSets.length;

  /* 1 — COMPLETION ------------------------------------------------------------- */
  (()=>{
    const planned = resolvedProgram(sess.workoutId)
      .reduce((t,{chosen:e})=>t + (parseInt(e.sets,10)||0), 0);
    const why = [];
    if(!planned){
      add("completion","Completion",15,15,["No prescribed set count to compare against — credited in full."]);
      return;
    }
    const ratio = nSets/planned;
    // Overshooting the plan isn't extra credit; hitting it is.
    const earned = 15 * Math.min(1, ratio);
    why.push(nSets+" working sets logged against "+planned+" planned ("+Math.round(ratio*100)+"%).");
    const skipped = resolvedProgram(sess.workoutId).length - entries.length;
    if(skipped > 0) why.push(skipped+" exercise"+(skipped>1?"s":"")+" from the plan didn't get logged.");
    if(ratio >= 1) why.push("Everything on the card got done.");
    add("completion","Completion",15,earned,why,
      ratio < 1 ? "Unfinished sets are the cheapest points on this card. If time is the constraint, superset the accessories rather than dropping them."
                : null);
  })();

  /* 2 — PROGRESSIVE OVERLOAD --------------------------------------------------- */
  (()=>{
    const prev = priorSessionFor(sess);
    const why = [];
    if(!prev){
      add("overload","Progressive overload",15,15*0.8,
        ["No previous "+widName(sess.workoutId).toLowerCase()+" session to compare against — this one becomes the baseline."],
        "From your next "+widName(sess.workoutId).toLowerCase()+" day on, this section grades you against today's numbers.");
      return;
    }
    let beat = 0, held = 0, lost = 0;
    const gains = [], drops = [];
    entries.forEach((e,i)=>{
      const occ = occIndex(entries, i);
      const hits = occurrencesIn(prev, e.name);
      if(!hits.length) return;
      const pe = hits[Math.min(occ, hits.length-1)];
      const top = sets => sets.reduce((b,st)=>{
        if(!isWorkingSet(st)) return b;
        const v = est1RM(parseFloat(st.weight)||0, parseFloat(st.reps)||0) || (parseFloat(st.reps)||0);
        return v > b ? v : b;
      }, 0);
      const a = top(e.sets), b = top(pe.sets);
      if(!a || !b) return;
      if(a > b*1.004){ beat++; gains.push(e.name); }
      else if(a >= b*0.985) held++;
      else { lost++; drops.push(e.name); }
    });
    const compared = beat + held + lost;
    if(!compared){
      add("overload","Progressive overload",15,15*0.8,
        ["None of today's exercises appear in the previous "+widName(sess.workoutId).toLowerCase()+" session, so there's nothing to compare."],
        "Keeping the same core movements week to week is what makes overload measurable.");
      return;
    }
    // Beating a lift is worth full credit, holding is worth most of it, going
    // backwards earns nothing — matching how overload actually drives adaptation.
    const earned = 15 * ((beat*1 + held*0.62) / compared);
    why.push(beat+" of "+compared+" compared lifts went up, "+held+" held, "+lost+" went down.");
    if(gains.length) why.push("Up: "+gains.slice(0,4).join(", ")+(gains.length>4?" +"+(gains.length-4)+" more":"")+".");
    if(drops.length) why.push("Down: "+drops.slice(0,4).join(", ")+(drops.length>4?" +"+(drops.length-4)+" more":"")+".");
    add("overload","Progressive overload",15,earned,why,
      beat === 0 && lost > 0
        ? "Nothing moved up and some lifts regressed — that's usually fatigue rather than effort. A lighter week often unlocks the next jump."
        : beat === 0
          ? "Holding is not failing, but pick one lift next session and add either 2.5–5 lb or a single rep. Overload only needs one variable to move."
          : null);
  })();

  /* 3 — EFFECTIVE INTENSITY ---------------------------------------------------- */
  (()=>{
    const rpes = allSets.map(x=>parseFloat(x.st.rpe)).filter(v=>v>0);
    const why = [];
    if(!rpes.length){
      add("intensity","Effective intensity",14,14*0.5,
        ["No RPE logged, so proximity to failure can't be assessed — scored at half credit."],
        "RPE is the single most informative number you can log. Even a rough 8 or 9 on the last set of each exercise makes this section real.");
      return;
    }
    const avg = rpes.reduce((a,b)=>a+b,0)/rpes.length;
    const inRange = rpes.filter(v=>v>=7 && v<=10).length;
    const junk = rpes.filter(v=>v<7).length;
    const maxedOut = rpes.filter(v=>v>=9.5).length;
    // Hypertrophy accrues from sets taken within ~4 reps of failure; below RPE 7 the
    // stimulus drops off sharply. Ideal average sits around 8.5.
    const rangeScore = inRange/rpes.length;                    // share of usable sets
    const avgScore = 1 - Math.min(1, Math.abs(avg - 8.5)/2.5); // how close the average is to 8.5
    let earned = 14 * (rangeScore*0.6 + avgScore*0.4);
    why.push("Average RPE "+r1(avg)+" across "+rpes.length+" scored sets"+(rpes.length<nSets?" ("+(nSets-rpes.length)+" unscored)":"")+".");
    why.push(inRange+" of "+rpes.length+" sets landed in the productive RPE 7–10 band.");
    if(junk) why.push(junk+" set"+(junk>1?"s":"")+" below RPE 7 — too far from failure to drive much growth.");
    if(maxedOut/rpes.length > 0.5){
      earned *= 0.9;
      why.push("Over half your sets went to RPE 9.5+; training that close to failure everywhere costs more recovery than it buys.");
    }
    add("intensity","Effective intensity",14,earned,why,
      avg < 7.5 ? "Most sets stopped short of where growth happens. Take the last set of each exercise to within 1–2 reps of failure."
      : maxedOut/rpes.length > 0.5 ? "Save true failure for the last set of an exercise. Earlier sets at RPE 8 give nearly the same stimulus for far less fatigue."
      : null);
  })();

  /* 4 — REST DISCIPLINE -------------------------------------------------------- */
  (()=>{
    const timed = allSets.filter(x=> x.st.rest != null && !x.e.superset);
    const why = [];
    if(!timed.length){
      add("rest","Rest discipline",14,14*0.5,
        ["No rest times recorded, so rest can't be graded — scored at half credit."],
        "The stopwatch starts on its own when you tap ✓. Leave it running and this section grades itself.");
      return;
    }
    let sum = 0, short = 0, long = 0, good = 0;
    timed.forEach(({e, st})=>{
      const t = restTargetFor(e, st);
      const r = st.rest;
      let s;
      if(r >= t.ideal[0] && r <= t.ideal[1]){ s = 1; good++; }
      else if(r < t.ideal[0]){
        // credit falls off toward zero as rest approaches nothing
        s = Math.max(0, r / t.ideal[0]) * 0.85;
        if(r < t.warn) short++;
      } else {
        // long rests cost far less than short ones — mostly a time problem
        s = Math.max(0.55, 1 - (r - t.ideal[1])/(t.ideal[1]*2));
        if(r > t.hard) long++;
      }
      sum += s;
    });
    const earned = 14 * (sum/timed.length);
    why.push(good+" of "+timed.length+" timed rests sat inside the window that set's load called for.");
    if(short) why.push(short+" rest"+(short>1?"s were":" was")+" cut short for the intensity — heavy and near-failure sets want 3–5 min, 8–12 rep work 1.5–3 min.");
    if(long) why.push(long+" rest"+(long>1?"s ran":" ran")+" well past the window, which stretches the session without adding stimulus.");
    const bands = {};
    timed.forEach(({e,st})=>{ const b = restTargetFor(e,st).band; bands[b] = (bands[b]||0)+1; });
    why.push("Set mix: "+Object.keys(bands).map(b=>bands[b]+" "+b).join(", ")+".");
    add("rest","Rest discipline",14,earned,why,
      short > timed.length*0.3
        ? "Short rests on heavy work quietly cap your loads — you're fighting the last set instead of the weight. Give the compounds a full 3 minutes."
        : long > timed.length*0.3 ? "Trim the long rests on accessories to about 90 seconds; you'll cut real time off the session for nothing."
        : null);
  })();

  /* 5 — REP-RANGE ADHERENCE ---------------------------------------------------- */
  (()=>{
    let inR = 0, under = 0, over = 0, checked = 0;
    allSets.forEach(({e, st})=>{
      const range = repRange(e.reps);
      if(!range) return;
      checked++;
      const r = parseFloat(st.reps)||0;
      if(r < range[0]) under++;
      else if(r > range[1]) over++;
      else inR++;
    });
    const why = [];
    if(!checked){
      add("reprange","Rep-range adherence",10,10,["No prescribed rep ranges on today's exercises — credited in full."]);
      return;
    }
    // one rep outside a range is a near miss, not a failure
    const earned = 10 * ((inR + (under+over)*0.45)/checked);
    why.push(inR+" of "+checked+" sets finished inside their prescribed rep range.");
    if(under) why.push(under+" set"+(under>1?"s":"")+" fell short — the load is likely too heavy for that range.");
    if(over) why.push(over+" set"+(over>1?"s":"")+" went over the top of the range — that load has become too light.");
    add("reprange","Rep-range adherence",10,earned,why,
      over > under && over > 1 ? "Sets finishing above the range are your cue to add weight. Move those up 5 lb next session."
      : under > 1 ? "Dropping below the range means the load is winning. Come down slightly and earn the reps back."
      : null);
  })();

  /* 6 — FATIGUE MANAGEMENT ----------------------------------------------------- */
  (()=>{
    const drops = [];
    entries.forEach(e=>{
      const ws = e.sets.filter(isWorkingSet);
      if(ws.length < 2) return;
      const first = parseFloat(ws[0].reps)||0;
      const last = parseFloat(ws[ws.length-1].reps)||0;
      if(!first) return;
      // compare like for like — a rep drop only counts at the same or heavier load
      const w0 = parseFloat(ws[0].weight)||0, wN = parseFloat(ws[ws.length-1].weight)||0;
      if(wN < w0*0.95) return;
      drops.push({name:e.name, drop:(first-last)/first, first, last});
    });
    const why = [];
    if(!drops.length){
      add("fatigue","Fatigue management",10,10*0.8,
        ["Not enough multi-set exercises at a steady load to measure drop-off."],
        null);
      return;
    }
    const avgDrop = drops.reduce((t,d)=>t+d.drop,0)/drops.length;
    const bad = drops.filter(d=>d.drop > 0.35);
    // A drop-off up to ~25% across sets is normal and expected; past ~35% the later
    // sets are being run on empty and contribute mostly fatigue rather than stimulus.
    const earned = 10 * Math.max(0, Math.min(1, 1 - Math.max(0, avgDrop - 0.25)/0.35));
    why.push("Reps fell "+Math.round(avgDrop*100)+"% on average from first set to last at the same load — up to about 25% is normal.");
    if(bad.length) why.push("Steep drop-off on "+bad.slice(0,3).map(d=>d.name+" ("+d.first+"→"+d.last+")").join(", ")+".");
    else why.push("Performance held well across sets — rest and load were matched to the work.");
    add("fatigue","Fatigue management",10,earned,why,
      bad.length ? "A collapse like that is nearly always too little rest or too heavy an opening set. Rest longer, or start 5 lb lighter and keep the reps."
      : null);
  })();

  /* 7 — SESSION EFFICIENCY ----------------------------------------------------- */
  (()=>{
    const why = [];
    if(!sess.startedAt || !sess.finishedAt || sess.finishedAt <= sess.startedAt){
      add("efficiency","Session efficiency",12,12*0.7,["No usable start/finish time for this session."],null);
      return;
    }
    const mins = (sess.finishedAt - sess.startedAt)/60000;
    // 40–80 min is the practical sweet spot: long enough for real volume, short enough
    // that quality and focus haven't decayed.
    let durScore;
    if(mins >= 40 && mins <= 80) durScore = 1;
    else if(mins < 40) durScore = Math.max(0.35, mins/40);
    else durScore = Math.max(0.4, 1 - (mins-80)/90);
    const density = nSets / Math.max(1, mins/60);      // working sets per hour
    const denScore = Math.max(0.35, Math.min(1, density/18));
    const earned = 12 * (durScore*0.6 + denScore*0.4);
    why.push(Math.round(mins)+" minutes for "+nSets+" working sets — "+r1(density)+" sets per hour.");
    why.push(mins < 40 ? "Short session; there's room for more volume before quality suffers."
           : mins > 80 ? "Long session — past about 80 minutes focus and set quality tend to fall off."
           : "Duration sits in the productive 40–80 minute window.");
    add("efficiency","Session efficiency",12,earned,why,
      density < 12 ? "Around "+r1(density)+" sets an hour means a lot of standing around. Supersetting unrelated accessories is free time."
      : mins > 95 ? "Split this into two shorter sessions if you can — two 50-minute workouts beat one 100-minute one."
      : null);
  })();

  /* 8 — LOG QUALITY ------------------------------------------------------------ */
  (()=>{
    const rpeN = allSets.filter(x=>parseFloat(x.st.rpe)>0).length;
    const restN = allSets.filter(x=>x.st.rest!=null).length;
    const ci = (S.checkins||{})[sess.date] || {};
    const bits = [
      {ok: nSets>0 && rpeN/nSets >= 0.8, w:3.5, yes:"RPE logged on "+Math.round(rpeN/Math.max(1,nSets)*100)+"% of sets", no:"RPE missing on "+(nSets-rpeN)+" of "+nSets+" sets"},
      {ok: nSets>0 && restN/nSets >= 0.6, w:2.5, yes:"rest timed on most sets",      no:"rest times recorded on only "+restN+" of "+nSets+" sets"},
      {ok: !!sess.feel,                   w:1.5, yes:"session feel rated",           no:"no feel rating"},
      {ok: !!(sess.note||"").trim(),      w:1.0, yes:"session note written",         no:"no session note"},
      {ok: !!(ci.sleep || ci.energy || ci.weight), w:1.5, yes:"daily check-in filled in", no:"no daily check-in for this date"}
    ];
    const earned = bits.reduce((t,b)=>t + (b.ok?b.w:0), 0);
    const good = bits.filter(b=>b.ok).map(b=>b.yes);
    const missing = bits.filter(b=>!b.ok).map(b=>b.no);
    const why = [];
    if(good.length) why.push("Captured: "+good.join(", ")+".");
    if(missing.length) why.push("Missing: "+missing.join(", ")+".");
    why.push("This is what makes every other section — and your Body map — accurate rather than guesswork.");
    add("logquality","Log quality",10,earned,why,
      missing.length ? "Each missing field is a place the analysis has to guess. RPE and rest are the two that matter most."
      : null);
  })();

  const total = secs.reduce((t,s)=>t+s.pts, 0);
  const maxTotal = secs.reduce((t,s)=>t+s.max, 0);
  const pct = maxTotal ? total/maxTotal : 0;
  return {
    total: Math.round(total),
    max: maxTotal,
    pct,
    grade: gradeFor(pct),
    sections: secs,
    prs: sessionPRs(sess),
    when: Date.now(),
    v: 1
  };
}
function scoreBlurb(q){
  const p = q.pct;
  const weakest = q.sections.slice().sort((a,b)=>a.pct-b.pct)[0];
  const lead = p >= .93 ? "Just about a model session."
    : p >= .85 ? "A strong session."
    : p >= .75 ? "A solid session with clear room to tighten up."
    : p >= .6  ? "The work got done, but a lot of value leaked out."
    : "This one was rough — worth understanding why before the next.";
  return lead + " Your weakest section was <b>" + esc(weakest.label) + "</b> at " +
    weakest.pts + "/" + weakest.max + ".";
}
function scoreCardHTML(q, sess){
  const ringPct = Math.round(q.pct*100);

    q.prs.forEach(p=> h += `<div class="rev-line"><b>🔥 ${esc(p.name)}</b><span class="num">${esc(p.kind)} · ${esc(p.weight||"bw")}×${esc(p.reps||"")}</span></div>`);

function openScoreCard(sess, onDone){

/* ---------- cycle review ---------- */
function cycleSummary(start, end){
  const sess = S.sessions.filter(s=>s.startedAt>=start && s.startedAt<=end);
  let vol = 0, durTotal = 0, durN = 0, feelTotal = 0, feelN = 0, totalReps = 0, totalSets = 0;
  let heaviest = null;               // {name, w, reps} — single heaviest load touched
  const perDay = {}, exTop = {}, exVol = {};
  sess.forEach(s=>{
    perDay[s.workoutId] = (perDay[s.workoutId]||0)+1;
    if(s.startedAt && s.finishedAt && s.finishedAt>s.startedAt){ durTotal += (s.finishedAt-s.startedAt); durN++; }
    if(s.feel){ feelTotal += s.feel; feelN++; }
    s.entries.forEach(e=>{
      e.sets.forEach(st=>{
        const w = parseFloat(st.weight)||0, reps = parseFloat(st.reps)||0;
        vol += w*reps;
        if(reps>0){ totalSets++; totalReps += reps; }
        exVol[e.name] = (exVol[e.name]||0) + w*reps;
        if(w>0 && (!heaviest || w>heaviest.w)) heaviest = {name:e.name, w, reps};
      });
      const t = e.sets.reduce((b,st)=>{
        const w = parseFloat(st.weight)||0;
        return b==null||w>b ? w : b;
      }, null);
      if(t!=null) exTop[e.name] = Math.max(exTop[e.name]||0, t);
    });
  });
  const avgDurMin = durN ? Math.round(durTotal/durN/60000) : null;
  const avgFeel = feelN ? Math.round(feelTotal/feelN*10)/10 : null;
  // most-worked movement by total volume
  let topVolEx = null;
  Object.keys(exVol).forEach(name=>{ if(exVol[name]>0 && (!topVolEx || exVol[name]>topVolEx.vol)) topVolEx = {name, vol:exVol[name]}; });
  // rest days that fall inside this cycle's window
  const restCount = (S.restLog||[]).filter(d=>{
    const ms = new Date(d+"T12:00:00").getTime();
    return ms>=start && ms<=end;
  }).length;
  return {vol:Math.round(vol), n:sess.length, perDay, exTop, avgDurMin, avgFeel, totalReps, totalSets, heaviest, topVolEx, restCount};
}
function buildCycleReview(){
  const now = Date.now();
  const cur = cycleSummary(S.cycleStart, now);
  const prev = S.lastCycle ? cycleSummary(S.lastCycle.start, S.lastCycle.end) : null;
  const moved = [], stalled = [];
  if(prev){
    Object.keys(cur.exTop).forEach(name=>{
      if(!(name in prev.exTop)) return;
      const d = cur.exTop[name] - prev.exTop[name];
      if(d > 0) moved.push({name, from:prev.exTop[name], to:cur.exTop[name]});
      else if(d === 0 && cur.exTop[name] > 0) stalled.push({name, w:cur.exTop[name]});
    });
  }
  return {cur, prevVol: prev?prev.vol:null, moved:moved.slice(0,6), stalled:stalled.slice(0,6), when:now};
}
// Router: full-screen "Wrapped" slideshow by default; plain modal when motion is reduced.
function openCycleReview(r){
  if(!r || !r.cur) return;
  if(reducedMotion()) openCycleReviewSimple(r);
  else openCycleWrapped(r);
}
function openCycleReviewSimple(r){
  if(!r || !r.cur) return;
  const pct = (r.prevVol && r.prevVol>0) ? Math.round((r.cur.vol - r.prevVol)/r.prevVol*100) : null;
  const dayLine = Object.keys(META).filter(k=>r.cur.perDay[k]).map(k=>META[k].name+" ×"+r.cur.perDay[k]).join(" · ");
  let h = `<h3>Cycle review</h3>
  <div class="rev-stat"><span class="num" style="font-size:26px;font-weight:600">${r.cur.vol.toLocaleString()} lb</span> total volume
    ${pct!=null?`<span class="num" style="color:${pct>=0?"var(--ok)":"var(--bad)"};margin-left:8px">${pct>=0?"+":""}${pct}% vs last cycle</span>`:""}</div>
  <div class="rev-stat">${r.cur.n} workouts — ${esc(dayLine)}</div>
  ${r.cur.avgDurMin?`<div class="rev-stat">Average workout: <span class="num">${r.cur.avgDurMin} min</span></div>`:""}
  ${r.cur.avgFeel?`<div class="rev-stat">Average feel: ${FEELS[Math.min(4,Math.max(0,Math.round(r.cur.avgFeel)-1))]} <span class="num">${r.cur.avgFeel}/5</span></div>`:""}`;
  if(r.moved.length){
    h += `<div class="rev-head">Moved up</div>`;
    r.moved.forEach(m=>{ h += `<div class="rev-line"><b>${esc(m.name)}</b><span class="num">${m.from} → ${m.to} lb</span></div>`; });
  }
  if(r.stalled.length){
    h += `<div class="rev-head">Held steady</div>`;
    r.stalled.forEach(m=>{ h += `<div class="rev-line"><b>${esc(m.name)}</b><span class="num">${m.w} lb</span></div>`; });
  }
  if(!r.moved.length && !r.stalled.length && r.prevVol==null){
    h += `<div class="sub" style="margin-top:10px">First full cycle logged — from the next one on, this review compares against it.</div>`;
  }
  h += `<button class="btn" style="margin-top:16px" id="closeModal">Done</button>`;
  showModal(h);
}

/* ---------- cycle review — "Wrapped" slideshow ---------- */
function wrCountUp(el, target, dur){
  if(!el) return;
  const raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : (cb=>setTimeout(()=>cb(Date.now()),16));
  dur = dur || 1400;
  let t0 = null;
  const tick = now=>{
    if(!el.isConnected) return;
    if(t0===null) t0 = now;
    const p = Math.min(1,(now-t0)/dur);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = Math.round(target*eased).toLocaleString();
    if(p<1) raf(tick);
  };
  raf(tick);
}
function buildWrappedSlides(r){
  const cur = r.cur || {};
  const DH = DAY_HEX;
  const slides = [];
  // 1 — intro
  slides.push({
    bg:"linear-gradient(160deg,#e05248,#4a82e0 52%,#46a85c)",
    html:`<div class="wr-emoji">🏋️</div>
      <div class="wr-kicker" style="margin-top:14px">Cycle complete</div>
      <div class="wr-hero">Your cycle,<br>wrapped</div>
      <div class="wr-sub">${cur.n||0} ${cur.n===1?"workout":"workouts"} in the books. Let's look back at what you moved.</div>`
  });
  // 2 — total volume
  const pct = (r.prevVol && r.prevVol>0) ? Math.round((cur.vol-r.prevVol)/r.prevVol*100) : null;
  slides.push({
    bg:"linear-gradient(160deg,#2a1466,#e05248)",
    html:`<div class="wr-kicker">You moved a total of</div>
      <div class="wr-big"><span id="wrVol">0</span></div>
      <div class="wr-unit">pounds</div>
      ${pct!=null
        ? `<div class="wr-pill">${pct>=0?"▲ +"+pct:"▼ "+pct}% vs last cycle</div>`
        : `<div class="wr-sub">Your first full cycle — the baseline every future one gets measured against.</div>`}`,
    onShow:st=>wrCountUp(st.querySelector("#wrVol"), cur.vol||0, 1700)
  });
  // 3 — workouts + day breakdown
  const dayChips = Object.keys(META).filter(k=>cur.perDay && cur.perDay[k])
    .map(k=>`<span class="wr-daychip"><span class="dot" style="background:${DH[k]}"></span>${META[k].name} ×${cur.perDay[k]}</span>`).join("");
  slides.push({
    bg:"linear-gradient(160deg,#0c4a37,#4a82e0)",
    html:`<div class="wr-kicker">You showed up</div>
      <div class="wr-big"><span id="wrN">0</span></div>
      <div class="wr-unit">${cur.n===1?"workout":"workouts"}</div>
      ${dayChips?`<div class="wr-daychips">${dayChips}</div>`:""}`,
    onShow:st=>wrCountUp(st.querySelector("#wrN"), cur.n||0, 900)
  });
  // 4 — reps + sets
  if(cur.totalReps){
    slides.push({
      bg:"linear-gradient(160deg,#6e3b00,#e8b62c)",
      html:`<div class="wr-kicker">That added up to</div>
        <div class="wr-big"><span id="wrReps">0</span></div>
        <div class="wr-unit">reps</div>
        <div class="wr-sub">across <b>${(cur.totalSets||0).toLocaleString()}</b> working sets. Every single one counted.</div>`,
      onShow:st=>wrCountUp(st.querySelector("#wrReps"), cur.totalReps||0, 1600)
    });
  }
  // 5 — heaviest load
  if(cur.heaviest && cur.heaviest.w>0){
    slides.push({
      bg:"linear-gradient(160deg,#4a0d0d,#e05248)",
      html:`<div class="wr-kicker">Heaviest weight you touched</div>
        <div class="wr-big"><span id="wrHv">0</span></div>
        <div class="wr-unit">lb</div>
        <div class="wr-sub">on <b>${esc(cur.heaviest.name)}</b>${cur.heaviest.reps?` — for ${cur.heaviest.reps} reps`:""}. 💪</div>`,
      onShow:st=>wrCountUp(st.querySelector("#wrHv"), cur.heaviest.w||0, 1200)
    });
  }
  // 6 — lifts that climbed
  if(r.moved && r.moved.length){
    slides.push({
      bg:"linear-gradient(160deg,#0c3d1c,#46a85c)",
      html:`<div class="wr-kicker">Getting stronger</div>
        <div class="wr-hero" style="font-size:clamp(26px,9vw,44px)">Lifts that<br>climbed</div>
        <div class="wr-list">${r.moved.slice(0,5).map(m=>`<div class="wr-row"><span>${esc(m.name)}</span><span class="num">${m.from} → ${m.to} lb</span></div>`).join("")}</div>`
    });
  }
  // 7 — most-worked movement
  if(cur.topVolEx && cur.topVolEx.name){
    slides.push({
      bg:"linear-gradient(160deg,#191f5e,#4a82e0)",
      html:`<div class="wr-kicker">Your most-worked movement</div>
        <div class="wr-hero" style="font-size:clamp(26px,8.5vw,46px)">${esc(cur.topVolEx.name)}</div>
        <div class="wr-pill">${Math.round(cur.topVolEx.vol).toLocaleString()} lb of total volume</div>`
    });
  }
  // 8 — feel + duration + rest
  if(cur.avgFeel || cur.avgDurMin || cur.restCount){
    const feelEmoji = cur.avgFeel ? FEELS[Math.min(4,Math.max(0,Math.round(cur.avgFeel)-1))] : "";
    let sub = "";
    if(cur.avgDurMin) sub = `Average session ran about <b>${cur.avgDurMin} minutes</b>${cur.restCount?`, with <b>${cur.restCount}</b> rest day${cur.restCount>1?"s":""} to recover`:""}.`;
    else if(cur.restCount) sub = `<b>${cur.restCount}</b> rest day${cur.restCount>1?"s":""} taken to recover.`;
    slides.push({
      bg:"linear-gradient(160deg,#3a2e00,#e8b62c)",
      html:`<div class="wr-kicker">How it felt</div>
        ${cur.avgFeel?`<div class="wr-emoji">${feelEmoji}</div><div class="wr-unit" style="margin-top:10px">${cur.avgFeel} / 5 on average</div>`:`<div class="wr-hero">Recovery<br>counts too</div>`}
        ${sub?`<div class="wr-sub">${sub}</div>`:""}`
    });
  }
  // 9 — outro
  slides.push({
    bg:"linear-gradient(160deg,#46a85c,#4a82e0 52%,#e05248)",
    html:`<div class="wr-emoji">🔁</div>
      <div class="wr-hero" style="margin-top:10px">Onto the<br>next cycle</div>
      <div class="wr-sub">Fresh slate, same iron. Go get it.</div>
      <div class="wr-done"><button id="wrDone">Let's go</button></div>`,
    onShow:st=>{ const b = st.querySelector("#wrDone"); if(b) b.onclick = ()=>{ const w=document.getElementById("wrapped"); if(w && !w.classList.contains("out")){ w.classList.add("out"); setTimeout(()=>w.remove(),420); } }; }
  });
  return slides;
}
function openCycleWrapped(r){
  if(!r || !r.cur){ return; }
  const slides = buildWrappedSlides(r);
  if(slides.length < 2){ openCycleReviewSimple(r); return; }
  const old = document.getElementById("wrapped"); if(old) old.remove();
  const el = document.createElement("div");
  el.id = "wrapped";
  el.innerHTML = `
    <div class="wr-bg"></div>
    <div class="wr-bars">${slides.map((s,i)=>`<div class="wr-bar" data-b="${i}"><i></i></div>`).join("")}</div>
    <div class="wr-top"><span class="wr-brand">Iron Log · Wrapped</span><button class="wr-x" aria-label="Close">✕</button></div>
    <div class="wr-stage"></div>
    <div class="wr-nav"><div class="wr-prev" aria-label="Previous"></div><div class="wr-next" aria-label="Next"></div></div>`;
  document.body.appendChild(el);
  const stage = el.querySelector(".wr-stage");
  const bg = el.querySelector(".wr-bg");
  const nav = el.querySelector(".wr-nav");
  const DUR = 5200;
  let idx = 0, timer = null;
  const close = ()=>{
    if(el.classList.contains("out")) return;
    clearTimeout(timer);
    el.classList.add("out");
    setTimeout(()=>el.remove(), 420);
  };
  const show = i=>{
    idx = Math.max(0, Math.min(i, slides.length-1));
    clearTimeout(timer);
    const sl = slides[idx];
    bg.style.background = sl.bg;
    stage.innerHTML = `<div class="wr-slide">${sl.html}</div>`;
    // story-style progress bars
    el.querySelectorAll(".wr-bar").forEach((b,j)=>{
      b.classList.remove("active","done");
      const fi = b.querySelector("i");
      fi.style.animation = "none";
      if(j<idx){ b.classList.add("done"); fi.style.width = "100%"; }
      else { fi.style.width = "0"; }
    });
    const active = el.querySelector(`.wr-bar[data-b="${idx}"]`);
    if(active){
      active.style.setProperty("--wrdur", DUR+"ms");
      const fi = active.querySelector("i");
      void fi.offsetWidth;              // reflow so the fill animation restarts
      fi.style.animation = "";
      fi.style.width = "";
      active.classList.add("active");
    }
    // last slide has an actual button → don't let the tap-nav overlay eat the click
    nav.style.display = (idx===slides.length-1) ? "none" : "flex";
    if(sl.onShow) sl.onShow(stage);
    if(idx < slides.length-1) timer = setTimeout(()=>show(idx+1), DUR);
  };
  const next = ()=>{ if(idx < slides.length-1) show(idx+1); else close(); };
  const prev = ()=>{ show(idx-1); };
  el.querySelector(".wr-x").onclick = close;
  el.querySelector(".wr-next").onclick = next;
  el.querySelector(".wr-prev").onclick = prev;
  let sx = null;
  el.addEventListener("touchstart", e=>{ sx = e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(sx==null) return;
    const dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if(Math.abs(dx) > 55){ dx<0 ? next() : prev(); }
  });
  show(0);
}

/* ---------- modal ---------- */
let MODAL_DISMISS = null;
// How to rebuild the modal that's currently showing, so a glossary term opened from
// inside it can offer a working "Back". Set by the modals that contain terms.
let MODAL_REOPEN = null;
function showModal(html){
  MODAL_DISMISS = null;
  MODAL_REOPEN = null;
  $("#modal").innerHTML = html;
  $("#modal").scrollTop = 0;
  $("#modalBg").classList.add("show");
  const c = $("#closeModal");
  if(c) c.onclick = hideModal;
}
function hideModal(){
  $("#modalBg").classList.remove("show");
  const d = MODAL_DISMISS;
  MODAL_DISMISS = null;
  if(d) d();                // a pending askConfirm resolves false
}
$("#modalBg").addEventListener("click", e=>{ if(e.target.id==="modalBg") hideModal(); });

/* A real in-app confirmation instead of the OS `confirm()` box — it can carry the
   formatting and the "why" that a native dialog can't, and it doesn't get suppressed
   by "prevent this page from creating more dialogs" after a few taps. */
function askConfirm(opts){
  return new Promise(resolve=>{
    let settled = false;
    const done = v=>{
      if(settled) return;
      settled = true;
      MODAL_DISMISS = null;
      $("#modalBg").classList.remove("show");
      resolve(v);
    };
    $("#modal").innerHTML = `<h3>${esc(opts.title||"Are you sure?")}</h3>
      <p style="color:var(--text);font-size:15px;line-height:1.5">${opts.body||""}</p>
      ${opts.meta?`<div class="sub num" style="margin:10px 0 0;font-size:12px;color:var(--faint)">${opts.meta}</div>`:""}
      <div class="btn-row" style="margin-top:18px">
        <button class="btn small" id="askYes" style="flex:1">${esc(opts.yes||"Yes")}</button>
      </div>
      <div class="btn-row"><button class="btn ghost small" id="askNo" style="flex:1">${esc(opts.no||"Cancel")}</button></div>`;
    $("#modal").scrollTop = 0;
    $("#modalBg").classList.add("show");
    $("#askYes").onclick = ()=>done(true);
    $("#askNo").onclick = ()=>done(false);
    MODAL_DISMISS = ()=>done(false);   // tapping the backdrop = "no"
  });
}

/* ================= GIST SYNC ================= */
async function gistFetch(path, opts={}){
  const res = await fetch("https://api.github.com/"+path, {
    ...opts,
    headers: {
      "Accept":"application/vnd.github+json",
      "Authorization":"Bearer "+S.sync.token,
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    let msg = res.status+"";
    try{ msg += " "+(await res.json()).message; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
function payload(){
  return JSON.stringify({program:S.program, pointer:S.pointer, cycleStart:S.cycleStart, cycleDone:S.cycleDone, restDay:S.restDay||null, restLog:S.restLog||[], lastCycle:S.lastCycle||null, lastReview:S.lastReview||null, checkins:S.checkins||{}, deleted:(S.deleted||[]).slice(-500), sessions:S.sessions, savedAt:S.savedAt}, null, 1);
}
async function connectGist(){
  S.sync.token = $("#tokenIn").value.trim();
  S.sync.gistId = $("#gistIn").value.trim();
  if(!S.sync.token){ toast("Paste a token first"); return; }
  save(); syncProfileRecord();
  try{
    if(!S.sync.gistId){
      const g = await gistFetch("gists", {method:"POST", body: JSON.stringify({
        description:"Iron Log — workout data", public:false,
        files:{[GIST_FILE]:{content:payload()}}
      })});
      S.sync.gistId = g.id;
      S.sync.lastSync = Date.now();
      save(); syncProfileRecord(); render();
      toast("Gist created for "+profileName()+" — synced");
    } else {
      save(); render();
      await syncNow(true);
    }
  }catch(err){ toast("GitHub error: "+err.message); }
}
/* Give the active profile its own private gist without anyone typing an ID. Called when
   a new person is created and a token is already on the device, which is the whole
   point of sharing the token at registry level. */
async function ensureGist(){
  if(!S.sync.token && PROF.token) S.sync.token = PROF.token;
  if(!S.sync.token || S.sync.gistId) return;
  setSyncStatus("pending");
  try{
    const g = await gistFetch("gists", {method:"POST", body: JSON.stringify({
      description:"Iron Log — "+profileName(), public:false,
      files:{[GIST_FILE]:{content:payload()}}
    })});
    S.sync.gistId = g.id;
    S.sync.lastSync = Date.now();
    save(); syncProfileRecord();
    setSyncStatus("ok");
    render();
    toast("Private gist created for "+profileName()+" ✓");
  }catch(err){
    setSyncStatus("err");
    toast("Couldn't create their gist: "+err.message);
  }
}
function mergeSessions(localArr, remoteArr, tomb){
  const byId = new Map();
  const consider = s=>{
    if(tomb.has(s.id)) return;
    const prev = byId.get(s.id);
    if(!prev){ byId.set(s.id, s); return; }
    // keep the version edited most recently (fall back to finishedAt)
    const t = s.edited || s.finishedAt || 0;
    const pt = prev.edited || prev.finishedAt || 0;
    if(t >= pt) byId.set(s.id, s);
  };
  localArr.forEach(consider);
  remoteArr.forEach(consider);
  return [...byId.values()].sort((a,b)=>a.startedAt-b.startedAt);
}
function pickRestDay(localRD, remoteRD){
  // never let a blank erase a real rest day; if both exist keep the more recent date
  const valid = rd => rd && rd.date;
  if(valid(localRD) && valid(remoteRD)){
    return (localRD.date >= remoteRD.date) ? localRD : remoteRD;
  }
  return valid(localRD) ? localRD : (valid(remoteRD) ? remoteRD : null);
}
function pruneRestDay(){
  // after the cycle anchor is settled, drop a rest day only if it predates this cycle
  if(S.restDay && S.restDay.date){
    const rdMs = new Date(S.restDay.date+"T12:00:00").getTime();
    if(rdMs < S.cycleStart - 24*3600e3) S.restDay = null;
  }
}
function reconcileCycleAfterMerge(remoteCycleStart){
  // adopt the earliest reasonable anchor so no session belonging to the
  // current cycle gets stranded outside the window after a merge
  const inferred = inferCycleStart();
  const candidates = [inferred];
  if(remoteCycleStart) candidates.push(remoteCycleStart);
  if(S.cycleStart) candidates.push(S.cycleStart);
  const floor = (S.lastCycle && S.lastCycle.end) ? S.lastCycle.end + 1 : 0;
  const valid = candidates.filter(c=>c >= floor);
  S.cycleStart = valid.length ? Math.min(...valid) : inferred;
  recomputeCycle(false);
  pruneRestDay();
}
async function syncNow(announce){
  if(!S.sync.token || !S.sync.gistId){ if(announce) toast("Connect first"); return; }
  try{
    const g = await gistFetch("gists/"+S.sync.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remote = null;
    if(f){
      let content = f.content;
      if(f.truncated){ content = await (await fetch(f.raw_url)).text(); }
      try{ remote = JSON.parse(content); }catch(e){}
    }
    if(remote && remote.savedAt > S.savedAt){
      const tomb = new Set([...(S.deleted||[]), ...(remote.deleted||[])]);
      S.program = remote.program;
      S.pointer = remote.pointer;
      S.restDay = pickRestDay(S.restDay, remote.restDay);
      if(remote.lastCycle) S.lastCycle = remote.lastCycle;
      if(remote.lastReview) S.lastReview = remote.lastReview;
      S.checkins = Object.assign({}, S.checkins||{}, remote.checkins||{});
      S.restLog = [...new Set([...(S.restLog||[]), ...(remote.restLog||[])])].sort();
      S.deleted = [...tomb];
      S.sessions = mergeSessions(S.sessions, remote.sessions, tomb);
      reconcileCycleAfterMerge(remote.cycleStart);
      S.savedAt = remote.savedAt;   // adopt remote's stamp; we merged its newer state
      saveQuiet();
    } else if(remote){
      const tomb = new Set([...(S.deleted||[]), ...(remote.deleted||[])]);
      S.checkins = Object.assign({}, remote.checkins||{}, S.checkins||{});
      S.restLog = [...new Set([...(S.restLog||[]), ...(remote.restLog||[])])].sort();
      S.restDay = pickRestDay(S.restDay, remote.restDay);
      S.deleted = [...tomb];
      S.sessions = mergeSessions(S.sessions, remote.sessions||[], tomb);
      reconcileCycleAfterMerge(remote.cycleStart);
      saveQuiet();   // keep our own (newer or equal) savedAt
    }
    await gistFetch("gists/"+S.sync.gistId, {method:"PATCH", body: JSON.stringify({files:{[GIST_FILE]:{content:payload()}}})});
    S.sync.lastSync = Date.now();
    // we just pushed the current state (with its existing savedAt) to the gist —
    // saveQuiet keeps our savedAt in lock-step with what's in the gist instead of
    // bumping it to now(), which would falsely mark this device as "newer" and cause
    // every subsequent open to re-push and confuse other devices' merge decisions.
    saveQuiet();
    setSyncStatus("ok");
    if(TAB==="sync"||announce) render();
    if(announce) toast("Synced ✓");
  }catch(err){ setSyncStatus("err"); toast("Sync failed: "+err.message); }
}

/* ---------- formal training report ---------- */
function longDate(d){
  return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
function setSentence(st){
  const w = (st.weight!=null && st.weight!=="") ? st.weight+" lb" : "bodyweight";
  let s = w+" × "+(st.reps||"?")+" reps";
  if(st.rpe) s += " at RPE "+st.rpe;
  return s;
}
function joinList(arr){
  if(arr.length<=1) return arr.join("");
  return arr.slice(0,-1).join(", ")+", and "+arr[arr.length-1];
}
function buildReportInner(){
  const sessions = [...S.sessions].sort((a,b)=>a.startedAt-b.startedAt);
  const first = sessions[0], lastS = sessions[sessions.length-1];
  const counts = {};
  sessions.forEach(s=>{ counts[s.workoutId]=(counts[s.workoutId]||0)+1; });
  const countLine = joinList(Object.keys(counts).map(k=>counts[k]+" "+META[k].name.toLowerCase()+" "+(counts[k]===1?"session":"sessions")));

  let body = `<h1>Training History Report</h1>
  <p class="meta">Prepared ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})} · Iron Log</p>
  <p>This report covers <b>${sessions.length}</b> logged training ${sessions.length===1?"session":"sessions"} from ${longDate(first.date)} through ${longDate(lastS.date)}, comprising ${countLine}.${(S.restLog&&S.restLog.length)?" Rest days taken: "+joinList(S.restLog.slice().sort().map(d=>longDate(d)))+".":""}</p>
  <hr>`;

  sessions.forEach(s=>{
    const m = META[s.workoutId];
    const vol = s.entries.reduce((t,e)=>t+e.sets.reduce((u,st)=>u+((parseFloat(st.weight)||0)*(parseFloat(st.reps)||0)),0),0);
    const dur = durFmt(s);
    const clock = ms => new Date(ms).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    const metaBits = [];
    if(s.startedAt) metaBits.push("Started: "+clock(s.startedAt));
    if(s.finishedAt) metaBits.push("Ended: "+clock(s.finishedAt));
    if(dur) metaBits.push("Duration: "+dur);
    if(s.feel) metaBits.push("Feel: "+FEELS[s.feel-1]+" ("+s.feel+"/5)");
    const ci = (S.checkins||{})[s.date];
    if(ci){
      if(ci.weight) metaBits.push("Bodyweight: "+esc(ci.weight)+" lb");
      if(ci.sleep) metaBits.push("Sleep: "+esc(ci.sleep)+" h");
      if(ci.energy) metaBits.push("Energy: "+esc(ci.energy)+"/10");
    }
    if(s.quality) metaBits.push("Quality score: "+s.quality.total+"/"+s.quality.max+" ("+s.quality.grade.replace("−","-")+")");
    if(s.note) metaBits.push("Note: "+esc(s.note));
    body += `<h2>${longDate(s.date)} — ${m.name} Day</h2>
    ${metaBits.length?`<p class="meta">${metaBits.join(" · ")}</p>`:""}
    <table><thead><tr><th>Exercise</th><th>Set</th><th>Weight (lb)</th><th>Reps</th><th>RPE</th><th>Rest</th></tr></thead><tbody>`;
    s.entries.forEach(e=>{
      const sets = e.sets.filter(st=>st.reps||st.weight);
      if(!sets.length) return;
      sets.forEach((st,i)=>{
        body += `<tr>${i===0?`<td rowspan="${sets.length}"><b>${esc(e.name)}</b></td>`:""}
          <td class="c">${i+1}</td>
          <td class="c">${st.weight!=null&&st.weight!==""?esc(st.weight):"bodyweight"}</td>
          <td class="c">${esc(st.reps||"")}</td>
          <td class="c">${esc(st.rpe||"—")}</td>
          <td class="c">${st.rest?esc(fmtClock(st.rest)):"—"}</td></tr>`;
      });
    });
    body += `</tbody></table>`;
    if(vol>0) body += `<p class="meta">Total working volume: ${Math.round(vol).toLocaleString()} lb.</p>`;
  });

  return body;
}
function buildReportHTML(){
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Training History Report</title>
  <style>
    body{font-family:Georgia,'Times New Roman',serif;color:#111;background:#fff;max-width:7.2in;margin:36px auto;padding:0 20px;line-height:1.55;font-size:12.5pt}
    h1{font-size:22pt;margin:0 0 2px;border-bottom:3px solid #111;padding-bottom:8px}
    h2{font-size:14pt;margin:26px 0 6px}
    p{margin:5px 0}
    .meta{color:#555;font-size:10.5pt;font-style:italic}
    table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:10.5pt}
    th,td{border:1px solid #999;padding:5px 9px;text-align:left;vertical-align:top}
    th{background:#eee;font-size:9pt;text-transform:uppercase;letter-spacing:.05em}
    td.c{text-align:center;font-variant-numeric:tabular-nums}
    tr{page-break-inside:avoid}
    hr{border:none;border-top:1px solid #bbb;margin:18px 0}
  </style></head><body>
  ${buildReportInner()}</body></html>`;
}
function openReport(){
  if(!S.sessions.length){ toast("Nothing to report yet"); return; }
  const inner = buildReportInner();
  let ov = document.getElementById("reportOverlay");
  if(ov) ov.remove();
  ov = document.createElement("div");
  ov.id = "reportOverlay";
  ov.innerHTML = `
    <div class="rep-bar">
      <button class="rep-btn close" id="repClose">‹ Close</button>
      <button class="rep-btn print" id="repPrint">Print / Save as PDF</button>
    </div>
    <div class="rep-scroll" id="repScroll">${inner}</div>`;
  document.body.appendChild(ov);
  document.body.classList.add("report-open");
  document.getElementById("repClose").onclick = ()=>{
    ov.remove();
    document.body.classList.remove("report-open");
  };
  document.getElementById("repPrint").onclick = ()=> window.print();
}
function downloadDoc(){
  if(!S.sessions.length){ toast("Nothing to report yet"); return; }
  const blob = new Blob(["﻿"+buildReportHTML()], {type:"application/msword"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "training-report-"+todayStr()+".doc";
  a.click();

}

/* ---------- repo backup (CSV + JSON committed to the GitHub repo) ---------- */
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function fmtSetShort(st){
  const w = (st.weight!=null && st.weight!=="") ? st.weight : "bw";
  let s = w+"×"+(st.reps||"?");
  if(st.rpe) s += " @"+st.rpe;
  return s;
}
function buildCSV(){
  const sessions = [...S.sessions].sort((a,b)=>b.startedAt-a.startedAt);
  let maxSets = 1;
  sessions.forEach(s=>s.entries.forEach(e=>{
    const n = e.sets.filter(st=>st.reps||st.weight).length;
    if(n>maxSets) maxSets = n;
  }));
  const header = ["Exercise"];
  for(let i=1;i<=maxSets;i++) header.push("Set "+i);
  const rows = [header];
  if(S.restLog && S.restLog.length){
    S.restLog.slice().sort().forEach(d=>{
      rows.push([d+" — REST DAY", ...Array(Math.max(0,maxSets)).fill("")]);
    });
    rows.push(Array(maxSets+1).fill(""));
  }
  sessions.forEach(s=>{
    rows.push([s.date+" — "+META[s.workoutId].name.toUpperCase(), s.note||"", ...Array(Math.max(0,maxSets-1)).fill("")]);
    s.entries.forEach(e=>{
      const sets = e.sets.filter(st=>st.reps||st.weight);
      if(!sets.length) return;
      const row = [e.name];
      for(let i=0;i<maxSets;i++) row.push(sets[i] ? fmtSetShort(sets[i]) : "");
      rows.push(row);
    });
    rows.push(Array(maxSets+1).fill(""));
  });
  return rows.map(r=>r.map(v=>{
    v = String(v==null?"":v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(",")).join("\n");
}
async function repoPut(path, content, message, branch){
  branch = branch || S.sync.branch || "main";
  for(let attempt=1; attempt<=3; attempt++){
    let sha = null;
    try{
      const cur = await gistFetch("repos/"+S.sync.repo+"/contents/"+encodeURIComponent(path)+"?ref="+branch+"&t="+Date.now());
      sha = cur.sha;
    }catch(e){ /* file doesn't exist yet — first commit */ }
    const body = {message, content: b64(content), branch};
    if(sha) body.sha = sha;
    try{
      await gistFetch("repos/"+S.sync.repo+"/contents/"+encodeURIComponent(path), {method:"PUT", body: JSON.stringify(body)});
      return;
    }catch(err){
      // 409 = another commit landed between our read and write — refetch sha and retry
      if(String(err.message).startsWith("409") && attempt<3){
        await new Promise(r=>setTimeout(r, 900*attempt));
        continue;
      }
      throw err;
    }
  }
}
let repoBusy = false, repoAgain = false;
async function repoBackup(announce){
  if(!S.sync.token || !S.sync.repo){ if(announce) toast("Add your repo in the Sync tab first"); return; }
  if(repoBusy){ repoAgain = true; return; }
  repoBusy = true;
  try{
    // Preflight: confirm the repo is reachable with this token, and learn its REAL
    // default branch. This is what turns the useless bare "404" into a fixable message
    // and quietly recovers from a main/master mismatch.
    let repoInfo;
    try{
      repoInfo = await gistFetch("repos/"+S.sync.repo);
    }catch(e){
      const m = String(e.message);
      if(m.startsWith("404")){
        throw new Error("repo '"+S.sync.repo+"' not visible to this token. Check it's spelled owner/repo, and that your token has the FULL 'repo' scope — a gist-only token gets 404 here, and private repos 404 without it.");
      }
      if(m.startsWith("401")){ throw new Error("token invalid or expired — paste a fresh one above."); }
      if(m.startsWith("403")){ throw new Error("token lacks the 'repo' scope. Regenerate a classic token with the 'repo' box checked."); }
      throw e;
    }
    // Fall back to the repo's actual default branch if the configured one doesn't exist.
    let branch = S.sync.branch || repoInfo.default_branch || "main";
    try{
      await gistFetch("repos/"+S.sync.repo+"/branches/"+encodeURIComponent(branch)+"?t="+Date.now());
    }catch(e){
      if(String(e.message).startsWith("404") && repoInfo.default_branch && repoInfo.default_branch!==branch){
        branch = repoInfo.default_branch;
        S.sync.branch = branch; save();
        if(announce) toast("Branch not found — switched to '"+branch+"'");
      }
    }
    const stamp = new Date().toLocaleString();
    await repoPut("workout-log.csv", buildCSV(), "Workout log update — "+stamp, branch);
    await repoPut("ironlog-backup.json", payload(), "Data backup — "+stamp, branch);
    S.sync.lastRepo = Date.now();
    save();
    setSyncStatus("ok");
    if(announce){ toast("Backed up to repo ✓"); if(TAB==="sync") render(); }
  }catch(err){
    setSyncStatus("err");
    toast("Repo backup failed: "+err.message);
  }finally{
    repoBusy = false;
    if(repoAgain){ repoAgain = false; repoBackup(false); }
  }
}

function exportJSON(){
  const blob = new Blob([payload()], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ironlog-backup-"+todayStr()+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d.program || !Array.isArray(d.sessions)) throw new Error("not an Iron Log file");
      S.program = d.program;
      S.pointer = d.pointer||0;
      if(d.cycleStart) S.cycleStart = d.cycleStart;
      if(d.checkins) S.checkins = d.checkins;
      if(Array.isArray(d.restLog)) S.restLog = d.restLog;
      S.sessions = d.sessions;
      recomputeCycle(false);
      save(); queueSync(); render(); toast("Imported ✓");
    }catch(err){ toast("Import failed: "+err.message); }
  };
  r.readAsText(file);
  e.target.value = "";
}
